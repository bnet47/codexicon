<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Codexicon — the Codex agent harness for production software</title>
  <desc id="desc">A dark teal and navy banner with a code shield, the Codexicon name, a production-software tagline, and badges for Codex-native workflows, token efficiency, and verifiable delivery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a1c"/>
      <stop offset=".52" stop-color="#10283a"/>
      <stop offset="1" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee5a6"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#83c3ff"/>
    </linearGradient>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#34d399" stop-opacity=".24"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="358" rx="20" fill="url(#background)" stroke="#294657" stroke-width="2"/>
  <circle cx="158" cy="58" r="150" fill="url(#tealGlow)" filter="url(#softGlow)"/>
  <circle cx="1045" cy="314" r="180" fill="url(#blueGlow)" filter="url(#softGlow)"/>

  <g opacity=".18" fill="none" stroke="#67e8f9" stroke-width="1.5">
    <path d="M884 84H1000L1020 104H1126"/>
    <path d="M924 126H1054L1072 144H1154"/>
    <path d="M914 282H1008L1028 262H1140"/>
    <circle cx="884" cy="84" r="4" fill="#67e8f9"/>
    <circle cx="1154" cy="144" r="4" fill="#67e8f9"/>
    <circle cx="914" cy="282" r="4" fill="#67e8f9"/>
  </g>

  <g transform="translate(72 91)">
    <path d="M58 4L112 30V88C112 137 58 170 58 170S4 137 4 88V30Z" fill="url(#accent)"/>
    <path d="M58 20L96 39V84C96 116 73 138 58 149C43 138 20 116 20 84V39Z" fill="#091824"/>
    <path d="M47 57L32 72L47 87" fill="none" stroke="#5ee5a6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M69 57L84 72L69 87" fill="none" stroke="#83c3ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 50L52 95" stroke="#d7f9ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="58" cy="121" r="5" fill="#5ee5a6"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="224" y="142" fill="#f8fafc" font-size="58" font-weight="800" letter-spacing="-1.8">Codexicon</text>
    <g transform="translate(532 103)">
      <rect width="42" height="42" rx="10" fill="#102f32" stroke="#5ee5a6" stroke-opacity=".7"/>
      <path d="M13 14L20 21L13 28M24 28H31" fill="none" stroke="#7cf0b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="224" y="187" fill="#a9bac8" font-size="21" font-weight="500">The #1 Codex Agent Harness for Production Software</text>

    <g transform="translate(224 222)" font-size="14" font-weight="650">
      <rect width="166" height="38" rx="19" fill="#102332" stroke="#5ee5a6" stroke-width="1.5"/>
      <circle cx="25" cy="19" r="4" fill="#5ee5a6"/>
      <text x="91" y="24" fill="#7cf0b8" text-anchor="middle">Codex-Native</text>

      <rect x="182" width="170" height="38" rx="19" fill="#102332" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="207" cy="19" r="4" fill="#38bdf8"/>
      <text x="273" y="24" fill="#7dd3fc" text-anchor="middle">Token Efficient</text>

      <rect x="368" width="198" height="38" rx="19" fill="#102332" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="393" cy="19" r="4" fill="#4ade80"/>
      <text x="473" y="24" fill="#86efac" text-anchor="middle">Verifiable Delivery</text>
    </g>

    <text x="1128" y="52" fill="#7f98a9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.5" text-anchor="end">NEW + ESTABLISHED REPOSITORIES</text>
    <text x="1128" y="318" fill="#617989" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.2" text-anchor="end">CONTEXT → WORKFLOW → EVIDENCE → EFFECT</text>
  </g>
</svg>
