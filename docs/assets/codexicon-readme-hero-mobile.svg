<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Codexicon — the Codex agent harness for production software</title>
  <desc id="desc">A mobile dark teal and navy banner with a code shield, the Codexicon name, a production-software tagline, and badges for Codex-native workflows, token efficiency, and verifiable delivery.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a1c"/>
      <stop offset=".52" stop-color="#10283a"/>
      <stop offset="1" stop-color="#0b1324"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee5a6"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#83c3ff"/>
    </linearGradient>
    <radialGradient id="tealGlow">
      <stop offset="0" stop-color="#34d399" stop-opacity=".24"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".2"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="1" y="1" width="718" height="558" rx="24" fill="url(#background)" stroke="#294657" stroke-width="2"/>
  <circle cx="92" cy="48" r="150" fill="url(#tealGlow)"/>
  <circle cx="650" cy="500" r="180" fill="url(#blueGlow)"/>

  <text x="674" y="45" fill="#7f98a9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="1.5" text-anchor="end">CODEX AGENT HARNESS</text>

  <g transform="translate(46 92)">
    <path d="M58 4L112 30V88C112 137 58 170 58 170S4 137 4 88V30Z" fill="url(#accent)"/>
    <path d="M58 20L96 39V84C96 116 73 138 58 149C43 138 20 116 20 84V39Z" fill="#091824"/>
    <path d="M47 57L32 72L47 87" fill="none" stroke="#5ee5a6" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M69 57L84 72L69 87" fill="none" stroke="#83c3ff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M64 50L52 95" stroke="#d7f9ff" stroke-width="5" stroke-linecap="round"/>
    <circle cx="58" cy="121" r="5" fill="#5ee5a6"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="184" y="166" fill="#f8fafc" font-size="62" font-weight="800" letter-spacing="-1.8">Codexicon</text>
    <g transform="translate(532 119)">
      <rect width="46" height="46" rx="11" fill="#102f32" stroke="#5ee5a6" stroke-opacity=".7"/>
      <path d="M14 15L22 23L14 31M27 31H34" fill="none" stroke="#7cf0b8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="46" y="304" fill="#a9bac8" font-size="26" font-weight="520">The #1 Codex Agent Harness</text>
    <text x="46" y="340" fill="#a9bac8" font-size="26" font-weight="520">for Production Software</text>

    <g transform="translate(46 390)" font-size="19" font-weight="650">
      <rect width="190" height="48" rx="24" fill="#102332" stroke="#5ee5a6" stroke-width="1.5"/>
      <circle cx="27" cy="24" r="5" fill="#5ee5a6"/>
      <text x="105" y="30" fill="#7cf0b8" text-anchor="middle">Codex-Native</text>

      <rect x="202" width="196" height="48" rx="24" fill="#102332" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="229" cy="24" r="5" fill="#38bdf8"/>
      <text x="300" y="30" fill="#7dd3fc" text-anchor="middle">Token Efficient</text>

      <rect x="410" width="252" height="48" rx="24" fill="#102332" stroke="#4ade80" stroke-width="1.5"/>
      <circle cx="437" cy="24" r="5" fill="#4ade80"/>
      <text x="536" y="30" fill="#86efac" text-anchor="middle">Verifiable Delivery</text>
    </g>

    <text x="46" y="505" fill="#6e8797" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" letter-spacing="1.2">NEW + ESTABLISHED REPOSITORIES</text>
  </g>
