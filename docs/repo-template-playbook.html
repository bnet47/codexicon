:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;

* {
  box-sizing: border-box;
}

html &gt; body {
  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--viz-font-weight-medium);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,

  font: inherit;

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);

.form-control[type=&quot;file&quot;] {
  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,
    calc(100% - 10px) 50%;
  background-repeat: no-repeat;
  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(

      color-mix(in srgb, var(--foreground) 7%, transparent)

  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));

  border-color: var(--ring);

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;codex-template-playbook&quot;&gt;
  &lt;style&gt;
    #codex-template-playbook {
      display: grid;
      gap: 2.5rem;
      color: var(--foreground);
    }

    #codex-template-playbook .playbook-section {
      display: grid;
      gap: 1rem;
    }

    #codex-template-playbook .stage-content {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem 1.5rem;
    }

    #codex-template-playbook .stage-content &gt; div {
      min-width: 0;
    }

    #codex-template-playbook .stage-content p {
      margin-bottom: 0;
    }

    #codex-template-playbook .route-list {
      display: grid;
    }

    #codex-template-playbook .route-head,
    #codex-template-playbook .route-row {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.9fr) minmax(0, 1.25fr);
      gap: 1rem;
      align-items: start;
      padding: 0.8rem 0;
      border-bottom: 1px solid var(--border);
    }

    #codex-template-playbook .route-head {
      color: var(--muted-foreground);
    }

    #codex-template-playbook .route-row code {
      overflow-wrap: anywhere;
    }

    #codex-template-playbook .route-label {
      display: none;
      color: var(--muted-foreground);
    }

    #codex-template-playbook .context-stack {
      display: grid;
      gap: 0.55rem;
    }

    #codex-template-playbook .context-layer {
      display: grid;
      grid-template-columns: minmax(8rem, 0.8fr) minmax(0, 1.6fr);
      gap: 1rem;
      align-items: center;
      padding: 0.9rem 1rem;
      background: color-mix(in srgb, var(--layer-color) 13%, transparent);
    }

    #codex-template-playbook .context-layer:nth-child(1) {
      margin-inline: 18%;
      --layer-color: var(--viz-series-1);
    }

    #codex-template-playbook .context-layer:nth-child(2) {
      margin-inline: 9%;
      --layer-color: var(--viz-series-2);
    }

    #codex-template-playbook .context-layer:nth-child(3) {
      --layer-color: var(--viz-series-3);
    }

    #codex-template-playbook .task-loop {
      display: grid;
      grid-template-columns: repeat(13, minmax(0, auto));
      align-items: center;
      gap: 0.35rem;
    }

    #codex-template-playbook .loop-node {
      display: grid;
      place-items: center;
      min-height: 4rem;
      padding: 0.55rem;
      text-align: center;
      background: color-mix(in srgb, var(--viz-series-1) 10%, transparent);
      border-bottom: 2px solid var(--viz-series-1);
    }

    #codex-template-playbook .loop-arrow {
      color: var(--muted-foreground);
      text-align: center;
    }

    #codex-template-playbook .guardrails {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 1.5rem;
    }

    #codex-template-playbook .guardrail {
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      padding: 0.9rem 0;
      border-top: 1px solid var(--border);
    }

    #codex-template-playbook .guardrail svg {
      flex: 0 0 auto;
      color: var(--viz-series-1);
    }

    #codex-template-playbook .prompt-anatomy {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 0.6rem;
    }

    #codex-template-playbook .prompt-part {
      min-width: 0;
      padding: 0.8rem;
      background: color-mix(in srgb, var(--muted) 70%, transparent);
      border-top: 2px solid var(--viz-series-2);
    }

    @media (max-width: 560px) {
      #codex-template-playbook .stage-content,
      #codex-template-playbook .guardrails,
      #codex-template-playbook .prompt-anatomy {
        grid-template-columns: 1fr;
      }

      #codex-template-playbook .route-head {
        display: none;
      }

      #codex-template-playbook .route-row {
        grid-template-columns: 1fr;
        gap: 0.25rem;
        padding: 1rem 0;
      }

      #codex-template-playbook .route-label {
        display: inline;
      }

      #codex-template-playbook .context-layer,
      #codex-template-playbook .context-layer:nth-child(1),
      #codex-template-playbook .context-layer:nth-child(2) {
        grid-template-columns: 1fr;
        gap: 0.2rem;
        margin-inline: 0;
      }

      #codex-template-playbook .task-loop {
        grid-template-columns: 1fr;
      }

      #codex-template-playbook .loop-arrow {
        transform: rotate(90deg);
      }
    }
  &lt;/style&gt;

  &lt;section class=&quot;playbook-section&quot; aria-labelledby=&quot;lifecycle-heading&quot;&gt;
    &lt;div&gt;
      &lt;h2 id=&quot;lifecycle-heading&quot;&gt;From intent to a verified project&lt;/h2&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Codexicon · Matchday sports app&lt;/span&gt;
      &lt;p class=&quot;text-muted&quot;&gt;Select a stage to see its contract.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Project lifecycle stages&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-stage=&quot;discover&quot; aria-pressed=&quot;true&quot;&gt;1 · Discover&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;init&quot; aria-pressed=&quot;false&quot;&gt;2 · Initialise&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;build&quot; aria-pressed=&quot;false&quot;&gt;3 · Build&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;creative&quot; aria-pressed=&quot;false&quot;&gt;4 · Experience&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;assure&quot; aria-pressed=&quot;false&quot;&gt;5 · Assure&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;ship&quot; aria-pressed=&quot;false&quot;&gt;6 · Ship&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;
      &lt;h3 id=&quot;stage-title&quot;&gt;Discover the project&lt;/h3&gt;
      &lt;div class=&quot;stage-content&quot;&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Purpose&lt;/span&gt;
          &lt;p id=&quot;stage-purpose&quot;&gt;Define the problem, user, observable outcome, constraints, and non-goals before choosing technology.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Invoke&lt;/span&gt;
          &lt;p&gt;&lt;code id=&quot;stage-command&quot;&gt;$discover&lt;/code&gt;&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Minimum configuration&lt;/span&gt;
          &lt;p&gt;&lt;strong id=&quot;stage-model&quot;&gt;GPT-5.6 Sol · Medium&lt;/strong&gt;&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Raise reasoning when&lt;/span&gt;
          &lt;p id=&quot;stage-model-note&quot;&gt;Use High for regulated or unusually ambiguous products; use Extra High when a wrong charter would create major safety, compliance, or investment risk.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Evidence to continue&lt;/span&gt;
          &lt;p id=&quot;stage-evidence&quot;&gt;An approved charter under agent_docs/briefs/.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Avoid&lt;/span&gt;
          &lt;p id=&quot;stage-avoid&quot;&gt;Selecting a framework or database before the problem and constraints require one.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;Sports app prompt&lt;/span&gt;
        &lt;p&gt;&lt;code id=&quot;stage-example&quot;&gt;$discover We want a mobile-first sports app for community football fans to follow fixtures, live scores, standings, and match alerts. Success means a fan can find today&#x27;s match and understand its current state in under 10 seconds. Constraints: accessible web app, no betting features, no provider selected.&lt;/code&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card&quot;&gt;
      &lt;h3&gt;How to read the model floor&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;Reliability-first policy:&lt;/strong&gt; each project gate uses &lt;strong&gt;GPT-5.6 Sol&lt;/strong&gt;. &lt;strong&gt;Luna · Extra High&lt;/strong&gt; may assist with narrow, reversible work after the requirements are fixed, but should not own a gate. Terra, GPT-5.5, and GPT-5.4 are not recommended by this playbook.&lt;/p&gt;
      &lt;p class=&quot;text-small text-muted&quot;&gt;This is a conservative workflow policy, not a claim that Terra is incapable. OpenAI positions Sol for complex reasoning and coding, Terra for balancing intelligence and cost, and Luna for cost-sensitive high-volume work; Luna roughly corresponds to the earlier nano tier. A model never replaces explicit done conditions, lint, tests, rendered inspection, or human approval. See the &lt;a href=&quot;https://developers.openai.com/api/docs/models&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;current model guide&lt;/a&gt; and &lt;a href=&quot;https://developers.openai.com/api/docs/models/gpt-5.6-luna&quot; target=&quot;_blank&quot; rel=&quot;noreferrer&quot;&gt;Luna model card&lt;/a&gt;.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div aria-labelledby=&quot;communication-economy-heading&quot;&gt;
      &lt;h3 id=&quot;communication-economy-heading&quot;&gt;Communication economy&lt;/h3&gt;
      &lt;div class=&quot;stage-content&quot;&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Built into the template&lt;/span&gt;
          &lt;p&gt;Dense updates, targeted context, bounded logs, progressively loaded skills, and restrained delegation.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Use &lt;code&gt;$concise&lt;/code&gt;&lt;/span&gt;
          &lt;p&gt;Request terse communication at any stage. Reasoning, exact code and errors, implementation, tests, review, and safety remain unchanged.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;What stays complete&lt;/span&gt;
          &lt;p&gt;Requirements, decisions, code, commands, errors, verification evidence, review findings, risks, and handoffs.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Do not trade away&lt;/span&gt;
          &lt;p&gt;Reasoning effort, tool evidence, test depth, security detail, review quality, or useful development context.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;text-small text-muted&quot;&gt;Communication compression and model reasoning are separate controls. The repository-native &lt;code&gt;$concise&lt;/code&gt; skill changes output style only and loads when relevant.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; aria-labelledby=&quot;prompt-heading&quot;&gt;
    &lt;h2 id=&quot;prompt-heading&quot;&gt;Give Codex four pieces of task truth&lt;/h2&gt;
    &lt;div class=&quot;prompt-anatomy&quot; role=&quot;list&quot; aria-label=&quot;Effective prompt structure&quot;&gt;
      &lt;div class=&quot;prompt-part&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Outcome&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Fans can follow a live match without refreshing.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;prompt-part&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Done when&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Score, clock, incidents, loading, stale, and error states are tested.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;prompt-part&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Constraints&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Mobile-first, keyboard accessible, existing API contract, no betting content.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;prompt-part&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Authority&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Local code changes only; do not commit, deploy, or contact users.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; aria-labelledby=&quot;routing-heading&quot;&gt;
    &lt;div&gt;
      &lt;h2 id=&quot;routing-heading&quot;&gt;Choose the smallest workflow that fits&lt;/h2&gt;
      &lt;p class=&quot;text-muted&quot;&gt;More ceremony only when uncertainty or reversibility requires it.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;route-list&quot; role=&quot;table&quot; aria-label=&quot;Workflow routing guide&quot;&gt;
      &lt;div class=&quot;route-head&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;columnheader&quot;&gt;Signal&lt;/span&gt;
        &lt;span role=&quot;columnheader&quot;&gt;Route&lt;/span&gt;
        &lt;span role=&quot;columnheader&quot;&gt;Result&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Clear, small change&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$quick&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Small complete implementation with focused verification&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Feature behaviour is genuinely unclear&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$brainstorm&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Approved behaviour before implementation&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Precise durable requirement&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$spec → $write-plan&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Executable contract; plan only when dependencies justify it&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Approved independent work packages&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$execute-plan&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Bounded execution with integrated verification&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Unknown cause or costly technical choice&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$investigate / $architecture-review&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Root cause or explicit reversible decision&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Customer-facing design or marketing&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$design-experience / $create-marketing&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Rendered, evidence-backed work followed by &lt;code&gt;$review-creative&lt;/code&gt;&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;First launch or major production change&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$production-readiness&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Evidence-backed READY, ACCEPTED RISK, or NOT READY decision before shipping&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; aria-labelledby=&quot;skills-heading&quot;&gt;
    &lt;div&gt;
      &lt;h2 id=&quot;skills-heading&quot;&gt;Explore every repository skill&lt;/h2&gt;
      &lt;p class=&quot;text-muted&quot;&gt;Choose by the shape of the work, not by how important it feels.&lt;/p&gt;
    &lt;/div&gt;
    &lt;label class=&quot;form-label&quot; for=&quot;skill-select&quot;&gt;Skill&lt;/label&gt;
    &lt;select id=&quot;skill-select&quot; class=&quot;form-select&quot;&gt;
      &lt;optgroup label=&quot;Project start&quot;&gt;
        &lt;option value=&quot;discover&quot;&gt;$discover&lt;/option&gt;
        &lt;option value=&quot;init&quot;&gt;$init&lt;/option&gt;
      &lt;/optgroup&gt;
      &lt;optgroup label=&quot;Define and plan&quot;&gt;
        &lt;option value=&quot;brainstorm&quot;&gt;$brainstorm&lt;/option&gt;
        &lt;option value=&quot;spec&quot;&gt;$spec&lt;/option&gt;
        &lt;option value=&quot;write-plan&quot;&gt;$write-plan&lt;/option&gt;
      &lt;/optgroup&gt;
      &lt;optgroup label=&quot;Implement&quot;&gt;
        &lt;option value=&quot;quick&quot;&gt;$quick&lt;/option&gt;
        &lt;option value=&quot;execute-plan&quot;&gt;$execute-plan&lt;/option&gt;
      &lt;/optgroup&gt;
      &lt;optgroup label=&quot;Customer experience&quot;&gt;
        &lt;option value=&quot;design-experience&quot;&gt;$design-experience&lt;/option&gt;
        &lt;option value=&quot;create-marketing&quot;&gt;$create-marketing&lt;/option&gt;
        &lt;option value=&quot;review-creative&quot;&gt;$review-creative&lt;/option&gt;
      &lt;/optgroup&gt;
      &lt;optgroup label=&quot;Diagnose and decide&quot;&gt;
        &lt;option value=&quot;investigate&quot;&gt;$investigate&lt;/option&gt;
        &lt;option value=&quot;architecture-review&quot;&gt;$architecture-review&lt;/option&gt;
        &lt;option value=&quot;retro&quot;&gt;$retro&lt;/option&gt;
      &lt;/optgroup&gt;
      &lt;optgroup label=&quot;Review and ship&quot;&gt;
        &lt;option value=&quot;review&quot;&gt;$review&lt;/option&gt;
        &lt;option value=&quot;production-readiness&quot;&gt;$production-readiness&lt;/option&gt;
        &lt;option value=&quot;ship&quot;&gt;$ship&lt;/option&gt;
        &lt;option value=&quot;conventional-commit&quot;&gt;$conventional-commit&lt;/option&gt;
      &lt;/optgroup&gt;
      &lt;optgroup label=&quot;Communication and continuity&quot;&gt;
        &lt;option value=&quot;concise&quot;&gt;$concise&lt;/option&gt;
        &lt;option value=&quot;context-dump&quot;&gt;$context-dump&lt;/option&gt;
      &lt;/optgroup&gt;
    &lt;/select&gt;

    &lt;div class=&quot;card&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;
      &lt;h3&gt;&lt;code id=&quot;skill-title&quot;&gt;$discover&lt;/code&gt;&lt;/h3&gt;
      &lt;div class=&quot;stage-content&quot;&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Use when&lt;/span&gt;
          &lt;p id=&quot;skill-when&quot;&gt;The copied template has no approved product definition and technical choices should wait.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Produces&lt;/span&gt;
          &lt;p id=&quot;skill-produces&quot;&gt;An approved charter covering the problem, user, outcome, constraints, evidence, and non-goals.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Usually followed by&lt;/span&gt;
          &lt;p&gt;&lt;code id=&quot;skill-next&quot;&gt;$init&lt;/code&gt;&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Sports app prompt&lt;/span&gt;
          &lt;p&gt;&lt;code id=&quot;skill-prompt&quot;&gt;$discover Define Matchday, a community football app for fixtures, live scores, standings, and match alerts. Clarify the users, observable success, data constraints, accessibility needs, and non-goals before choosing a stack.&lt;/code&gt;&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; aria-labelledby=&quot;loop-heading&quot;&gt;
    &lt;h2 id=&quot;loop-heading&quot;&gt;After setup, repeat one disciplined loop&lt;/h2&gt;
    &lt;div class=&quot;task-loop&quot; aria-label=&quot;Feature delivery loop&quot;&gt;
      &lt;div class=&quot;loop-node&quot;&gt;Outcome&lt;/div&gt;&lt;div class=&quot;loop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;loop-node&quot;&gt;Smallest skill&lt;/div&gt;&lt;div class=&quot;loop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;loop-node&quot;&gt;Inspect&lt;/div&gt;&lt;div class=&quot;loop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;loop-node&quot;&gt;Change&lt;/div&gt;&lt;div class=&quot;loop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;loop-node&quot;&gt;Focused check&lt;/div&gt;&lt;div class=&quot;loop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;loop-node&quot;&gt;Full verify&lt;/div&gt;&lt;div class=&quot;loop-arrow&quot; aria-hidden=&quot;true&quot;&gt;→&lt;/div&gt;
      &lt;div class=&quot;loop-node&quot;&gt;Report&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; aria-labelledby=&quot;context-heading&quot;&gt;
    &lt;div&gt;
      &lt;h2 id=&quot;context-heading&quot;&gt;Context expands only when the task needs it&lt;/h2&gt;
      &lt;p class=&quot;text-muted&quot;&gt;The template keeps ordinary work lean without weakening engineering checks.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;context-stack&quot; role=&quot;list&quot; aria-label=&quot;Progressive context layers&quot;&gt;
      &lt;div class=&quot;context-layer&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;Always loaded&lt;/strong&gt;
        &lt;span&gt;&lt;code&gt;AGENTS.md&lt;/code&gt; + skill metadata · kept below the enforced repository context budget&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;context-layer&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;Loaded on demand&lt;/strong&gt;
        &lt;span&gt;One relevant &lt;code&gt;SKILL.md&lt;/code&gt; and only the reference it routes to&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;context-layer&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;Task-local evidence&lt;/strong&gt;
        &lt;span&gt;Targeted source, rendered output, focused logs, and &lt;code&gt;scripts/lint.sh&lt;/code&gt;, &lt;code&gt;scripts/test.sh&lt;/code&gt;, &lt;code&gt;scripts/security.sh&lt;/code&gt;&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; aria-labelledby=&quot;boundaries-heading&quot;&gt;
    &lt;h2 id=&quot;boundaries-heading&quot;&gt;Durable boundaries stay explicit&lt;/h2&gt;
    &lt;div class=&quot;guardrails&quot;&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;key-round&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Credentials stay out&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Protected stores and environment dumps are blocked; local, Git, and CI scans reveal only safe locations.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Git authority is granular&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Commit, push, and pull request actions must be explicitly requested.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Verification is proportional&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Focused checks first; lint, tests, and security before publication; readiness evidence before production.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;radio-tower&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;External effects are separate&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Publishing, deployment, production changes, spend, and messages need their own authority.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;codex-template-playbook&#x27;);
      const stages = {
        discover: {
          title: &#x27;Discover the project&#x27;,
          purpose: &#x27;Define the problem, user, observable outcome, constraints, and non-goals before choosing technology.&#x27;,
          command: &#x27;$discover&#x27;,
          model: &#x27;GPT-5.6 Sol · Medium&#x27;,
          modelNote: &#x27;Use High for regulated or unusually ambiguous products; use Extra High when a wrong charter would create major safety, compliance, or investment risk.&#x27;,
          evidence: &#x27;An approved charter under agent_docs/briefs/.&#x27;,
          avoid: &#x27;Selecting a framework or database before the problem and constraints require one.&#x27;,
          example: &#x27;$discover We want a mobile-first sports app for community football fans to follow fixtures, live scores, standings, and match alerts. Success means a fan can find today\&#x27;s match and understand its current state in under 10 seconds. Constraints: accessible web app, no betting features, no provider selected.&#x27;
        },
        init: {
          title: &#x27;Initialise the real environment&#x27;,
          purpose: &#x27;Choose the smallest suitable stack and replace every template stub with real setup, development, lint, test, security, Git-gate, and CI commands.&#x27;,
          command: &#x27;$init&#x27;,
          model: &#x27;GPT-5.6 Sol · Medium&#x27;,
          modelNote: &#x27;Use High for unfamiliar stacks or complex infrastructure; use Extra High for security, compliance, migration, or production-critical setup.&#x27;,
          evidence: &#x27;Project identity, security and operations boundaries are filled; real commands, Git gates, CI, and supported platforms are verified.&#x27;,
          avoid: &#x27;Adding providers, dependencies, databases, or deployment services before the charter requires them.&#x27;,
          example: &#x27;$init Configure Matchday from the approved charter. Recommend the smallest stack for a responsive web app with live-score updates, create real setup/lint/test commands and CI, and do not initialise Git or add hosting unless requested.&#x27;
        },
        build: {
          title: &#x27;Build the first useful slice&#x27;,
          purpose: &#x27;Deliver the smallest complete behaviour that proves value, using the least ceremonial workflow that fits.&#x27;,
          command: &#x27;$quick · $brainstorm · $spec · $execute-plan&#x27;,
          model: &#x27;GPT-5.6 Sol · Low&#x27;,
          modelNote: &#x27;Use Medium for normal multi-file features, High for architecture or long-context work, and Extra High for security, data integrity, or expensive failure modes.&#x27;,
          evidence: &#x27;Observable behaviour, focused tests, canonical lint and tests, and a concise report of residual gaps.&#x27;,
          avoid: &#x27;Large scaffolds, speculative abstractions, unrelated cleanup, or plans for a clear one-file change.&#x27;,
          example: &#x27;$quick Add the Matchday fixture list using the existing API client. Done when upcoming matches show competition, teams, kickoff in the user\&#x27;s timezone, loading, empty, and error states, with focused tests and full repository checks.&#x27;
        },
        creative: {
          title: &#x27;Strengthen the customer experience&#x27;,
          purpose: &#x27;Shape interfaces or marketing from real users, brand context, product truth, reachable states, and approved evidence.&#x27;,
          command: &#x27;$design-experience · $create-marketing&#x27;,
          model: &#x27;GPT-5.6 Sol · Medium&#x27;,
          modelNote: &#x27;Use High for a new visual system, complex interaction, or important campaign; use Extra High when trust, accessibility, or brand damage would be costly.&#x27;,
          evidence: &#x27;Rendered output, complete states, accessible behaviour, sourced claims, channel fit, and explicit unknowns.&#x27;,
          avoid: &#x27;Generic visual systems, fake metrics or proof, decorative dashboards, unsupported claims, and unverified polish.&#x27;,
          example: &#x27;$design-experience Design Matchday\&#x27;s live match centre for fans checking a phone in a noisy stadium. Preserve the current identity, shape the score, clock, incidents, lineups, loading, stale, offline, and final states, then verify rendered mobile and desktop output.&#x27;
        },
        assure: {
          title: &#x27;Assure correctness and quality&#x27;,
          purpose: &#x27;Review the work against its request, engineering contract, customer task, brand, accessibility, truth, and release risk.&#x27;,
          command: &#x27;$review · $review-creative&#x27;,
          model: &#x27;GPT-5.6 Sol · High&#x27;,
          modelNote: &#x27;Use Extra High for security, privacy, payments, migrations, destructive operations, or release-blocking reviews. Do not use a weaker reviewer than the builder.&#x27;,
          evidence: &#x27;No unresolved release blockers; verification gaps are visible; lint and the full test suite pass when applicable.&#x27;,
          avoid: &#x27;Reviewing only source when rendered behaviour matters, cosmetic scoring, or manufacturing findings.&#x27;,
          example: &#x27;$review-creative Audit Matchday\&#x27;s rendered live match centre for comprehension, responsive behaviour, keyboard access, contrast, stale-score trust, generic sports-app patterns, and fabricated data. Report findings only; do not edit.&#x27;
        },
        ship: {
          title: &#x27;Prove readiness, then ship only what was authorised&#x27;,
          purpose: &#x27;Run the production gate when applicable, then perform only the explicitly requested Git action. Deployment and external writes remain separate decisions.&#x27;,
          command: &#x27;$production-readiness (launch) · $ship&#x27;,
          model: &#x27;GPT-5.6 Sol · Low for Git / High for production&#x27;,
          modelNote: &#x27;Use Medium for a large final diff. Use High for the production gate and Extra High for security, privacy, payments, migrations, destructive operations, or hard-to-reverse releases.&#x27;,
          evidence: &#x27;Security, lint, and tests pass; launch evidence is READY or explicitly accepted; only the requested Git action is completed.&#x27;,
          avoid: &#x27;Inferring publication, pushing to main, deploying, or sending external messages from a vague request to finish.&#x27;,
          example: &#x27;$ship Verify the Matchday fixture and live-score work, create a local commit with an appropriate message, and stop. Do not push, open a pull request, deploy, or message anyone.&#x27;
        }
      };

      const skillDetails = {
        discover: {
          title: &#x27;$discover&#x27;,
          when: &#x27;The copied template has no approved product definition and technical choices should wait.&#x27;,
          produces: &#x27;An approved charter covering the problem, user, outcome, constraints, evidence, and non-goals.&#x27;,
          next: &#x27;$init&#x27;,
          prompt: &#x27;$discover Define Matchday, a community football app for fixtures, live scores, standings, and match alerts. Clarify the users, observable success, data constraints, accessibility needs, and non-goals before choosing a stack.&#x27;
        },
        init: {
          title: &#x27;$init&#x27;,
          when: &#x27;A charter is approved and the unconfigured template must become a working project.&#x27;,
          produces: &#x27;The smallest suitable stack, project identity, real source/test structure, commands, CI, and verified local setup.&#x27;,
          next: &#x27;$quick or the workflow that fits the first slice&#x27;,
          prompt: &#x27;$init Configure Matchday from the approved charter. Recommend the smallest stack for a responsive web app with live-score updates, create real setup/lint/test commands and CI, and do not initialise Git or add hosting unless requested.&#x27;
        },
        brainstorm: {
          title: &#x27;$brainstorm&#x27;,
          when: &#x27;Feature behaviour or approach is genuinely unclear and different choices would change the product.&#x27;,
          produces: &#x27;Resolved alternatives and an approved behavioural specification; no premature implementation.&#x27;,
          next: &#x27;$spec or $write-plan when implementation is non-trivial&#x27;,
          prompt: &#x27;$brainstorm Decide how Matchday fans subscribe to goal, halftime, and final-score alerts. Resolve team versus match subscriptions, quiet hours, duplicate alerts, permissions, and cancellation before implementation.&#x27;
        },
        spec: {
          title: &#x27;$spec&#x27;,
          when: &#x27;The request is precise but needs a durable executable contract before code changes.&#x27;,
          produces: &#x27;Scope, behaviour, states, edge cases, acceptance criteria, and verification requirements.&#x27;,
          next: &#x27;$quick or $write-plan&#x27;,
          prompt: &#x27;$spec Specify Matchday offline score handling. Define freshness indicators, cached data, reconnect behaviour, incident ordering, accessibility announcements, analytics boundaries, and acceptance tests.&#x27;
        },
        &#x27;write-plan&#x27;: {
          title: &#x27;$write-plan&#x27;,
          when: &#x27;An approved spec spans dependent tasks, files, or verification stages that benefit from sequencing.&#x27;,
          produces: &#x27;Dependency-aware tasks with file scopes, acceptance mapping, and verification for each step.&#x27;,
          next: &#x27;$execute-plan&#x27;,
          prompt: &#x27;$write-plan Turn the approved Matchday live-match specification into tasks for API streaming, state management, match UI, accessibility, tests, and browser verification. Map every acceptance criterion to a task and check.&#x27;
        },
        quick: {
          title: &#x27;$quick&#x27;,
          when: &#x27;A clear change affects roughly one to three files and requires no design, dependency, schema, or architecture decision.&#x27;,
          produces: &#x27;The smallest complete implementation with focused checks and canonical repository verification.&#x27;,
          next: &#x27;$review when risk warrants it&#x27;,
          prompt: &#x27;$quick Add the Matchday fixture timezone label using the existing date utility. Done when kickoff shows the viewer timezone, handles missing timezone data, has focused tests, and full lint/tests pass.&#x27;
        },
        &#x27;execute-plan&#x27;: {
          title: &#x27;$execute-plan&#x27;,
          when: &#x27;An approved plan contains independent implementation work that can be delegated without losing integration control.&#x27;,
          produces: &#x27;Integrated implementation of the approved tasks with bounded delegation and final verification.&#x27;,
          next: &#x27;$review&#x27;,
          prompt: &#x27;$execute-plan Implement the approved Matchday standings and team-page plan. Delegate only independent tasks, preserve unrelated work, integrate centrally, and run every acceptance check in the plan.&#x27;
        },
        &#x27;design-experience&#x27;: {
          title: &#x27;$design-experience&#x27;,
          when: &#x27;An app or website needs intentional UI/UX, responsive states, accessibility, a visual system, redesign, or frontend polish.&#x27;,
          produces: &#x27;A shaped, distinctive, production-grade experience verified in rendered and operational states.&#x27;,
          next: &#x27;$review-creative&#x27;,
          prompt: &#x27;$design-experience Design Matchday\&#x27;s live match centre for fans checking a phone in a noisy stadium. Preserve the current identity, shape score, clock, incidents, lineups, loading, stale, offline, and final states, then verify mobile and desktop output.&#x27;
        },
        &#x27;create-marketing&#x27;: {
          title: &#x27;$create-marketing&#x27;,
          when: &#x27;Positioning, conversion copy, a campaign, launch, channel adaptation, or measurement needs evidence-backed execution.&#x27;,
          produces: &#x27;Channel-native assets plus an evidence ledger, assumptions, approvals, and measurement contract.&#x27;,
          next: &#x27;$review-creative before publication&#x27;,
          prompt: &#x27;$create-marketing Create Matchday launch copy for match alerts: one landing-page section and one email. Use only verified product behaviour, label unknown notification coverage, define measurement, and do not publish or send.&#x27;
        },
        &#x27;review-creative&#x27;: {
          title: &#x27;$review-creative&#x27;,
          when: &#x27;Customer-facing design, marketing, documents, presentations, or visuals need an independent anti-slop quality gate.&#x27;,
          produces: &#x27;Prioritised evidence-based findings, verification gaps, and a READY or NEEDS WORK verdict; no edits.&#x27;,
          next: &#x27;Fix confirmed findings, rerender, then review again&#x27;,
          prompt: &#x27;$review-creative Audit Matchday\&#x27;s rendered live match centre and launch page for comprehension, accessibility, stale-score trust, brand fit, unsupported claims, and generic sports-app patterns. Report findings only.&#x27;
        },
        investigate: {
          title: &#x27;$investigate&#x27;,
          when: &#x27;A reproducible failure or unexplained behaviour has an unknown cause.&#x27;,
          produces: &#x27;A root-cause diagnosis with evidence and the smallest credible fix direction; diagnosis only unless a fix is requested.&#x27;,
          next: &#x27;$quick or $spec after the cause is known&#x27;,
          prompt: &#x27;$investigate Matchday displays the same goal twice after reconnecting to live updates. Reproduce it, trace event identity and reconnect state, identify the root cause, and do not implement a fix yet.&#x27;
        },
        &#x27;architecture-review&#x27;: {
          title: &#x27;$architecture-review&#x27;,
          when: &#x27;A framework, database, integration, ownership boundary, or other expensive-to-reverse choice needs evaluation.&#x27;,
          produces: &#x27;A recommendation with trade-offs, reversibility, evidence, and an ADR only when authorised.&#x27;,
          next: &#x27;$spec or an authorised ADR&#x27;,
          prompt: &#x27;$architecture-review Evaluate Server-Sent Events versus WebSockets for Matchday live scores across mobile networks. Compare reliability, scale, hosting, recovery, testing, and operational cost. Do not record an ADR unless I approve the decision.&#x27;
        },
        retro: {
          title: &#x27;$retro&#x27;,
          when: &#x27;A milestone, repeated blockage, scope drift, or invalid plan requires reassessing direction rather than debugging one defect.&#x27;,
          produces: &#x27;A continue, stop, or pivot recommendation with evidence and concrete next action.&#x27;,
          next: &#x27;Continue, re-specify, or stop based on the decision&#x27;,
          prompt: &#x27;$retro Matchday has completed two milestones but live-data integration keeps expanding scope and delaying fan-visible value. Assess whether to continue, narrow to scheduled scores, or pivot the delivery sequence.&#x27;
        },
        review: {
          title: &#x27;$review&#x27;,
          when: &#x27;A diff needs a read-only correctness, security, regression, scope, and test review against its request or spec.&#x27;,
          produces: &#x27;Prioritised actionable findings and verification gaps; no modifications.&#x27;,
          next: &#x27;Fix findings, verify, then $ship if authorised&#x27;,
          prompt: &#x27;$review Review the Matchday match-reminder diff against its approved spec. Focus on duplicate scheduling, timezone changes, opt-out behaviour, privacy, regressions, and missing tests. Do not edit.&#x27;
        },
        &#x27;production-readiness&#x27;: {
          title: &#x27;$production-readiness&#x27;,
          when: &#x27;A first launch or major production change needs evidence across security, data, recovery, observability, capacity, abuse resistance, and rollback.&#x27;,
          produces: &#x27;Prioritised gaps plus a READY, READY WITH ACCEPTED RISK, or NOT READY verdict; no deployment or risk acceptance.&#x27;,
          next: &#x27;Close blockers, rerun the gate, then $ship under explicit Git authority&#x27;,
          prompt: &#x27;$production-readiness Audit Matchday before launch. Verify account and club-admin authorization, live-score provider failure, notification abuse and rate limits, privacy and retention, dependency risk, observability, capacity, backups and restore evidence, migration order, rollback, incident ownership, and canonical security/lint/tests. Do not deploy or accept risk for me.&#x27;
        },
        ship: {
          title: &#x27;$ship&#x27;,
          when: &#x27;The user explicitly requests a commit, push, or draft pull request after the work is ready.&#x27;,
          produces: &#x27;Security/lint/test verified changes and only the authorised Git action; never an inferred deployment.&#x27;,
          next: &#x27;Deployment only under separate explicit authority&#x27;,
          prompt: &#x27;$ship Verify the Matchday fixture and live-score work, create a local commit with an appropriate message, and stop. Do not push, open a pull request, deploy, or message anyone.&#x27;
        },
        &#x27;conventional-commit&#x27;: {
          title: &#x27;$conventional-commit&#x27;,
          when: &#x27;A Conventional Commit message is requested without authorising any Git operation.&#x27;,
          produces: &#x27;A correctly scoped commit subject and optional body; no commit is created.&#x27;,
          next: &#x27;$ship only if a Git action is explicitly requested&#x27;,
          prompt: &#x27;$conventional-commit Draft a commit message for replacing Matchday score polling with reconnect-safe event streaming and adding duplicate-event tests. Do not run Git.&#x27;
        },
        concise: {
          title: &#x27;$concise&#x27;,
          when: &#x27;The user wants shorter progress updates and answers without reducing implementation, reasoning, safety, or verification quality.&#x27;,
          produces: &#x27;Dense communication with exact technical evidence preserved.&#x27;,
          next: &#x27;Use alongside the task-specific skill&#x27;,
          prompt: &#x27;$concise Keep updates terse while adding the Matchday competition filter. Preserve exact code, errors, decisions, and test results; do not reduce engineering checks.&#x27;
        },
        &#x27;context-dump&#x27;: {
          title: &#x27;$context-dump&#x27;,
          when: &#x27;A human-readable handoff is requested or a complex session must continue cleanly elsewhere; not for routine completion.&#x27;,
          produces: &#x27;A concise checkpoint containing objective, decisions, changed files, verification, open risks, and next action.&#x27;,
          next: &#x27;Resume from the checkpoint in a fresh task&#x27;,
          prompt: &#x27;$context-dump Save a handoff for Matchday\&#x27;s live match centre: current objective, approved behaviour, architecture decisions, changed files, test status, unresolved reconnect issue, and the exact next step.&#x27;
        }
      };

      const title = root.querySelector(&#x27;#stage-title&#x27;);
      const purpose = root.querySelector(&#x27;#stage-purpose&#x27;);
      const command = root.querySelector(&#x27;#stage-command&#x27;);
      const model = root.querySelector(&#x27;#stage-model&#x27;);
      const modelNote = root.querySelector(&#x27;#stage-model-note&#x27;);
      const evidence = root.querySelector(&#x27;#stage-evidence&#x27;);
      const avoid = root.querySelector(&#x27;#stage-avoid&#x27;);
      const stageExample = root.querySelector(&#x27;#stage-example&#x27;);
      const buttons = [...root.querySelectorAll(&#x27;[data-stage]&#x27;)];
      const skillSelect = root.querySelector(&#x27;#skill-select&#x27;);
      const skillTitle = root.querySelector(&#x27;#skill-title&#x27;);
      const skillWhen = root.querySelector(&#x27;#skill-when&#x27;);
      const skillProduces = root.querySelector(&#x27;#skill-produces&#x27;);
      const skillNext = root.querySelector(&#x27;#skill-next&#x27;);
      const skillPrompt = root.querySelector(&#x27;#skill-prompt&#x27;);

      const selectStage = (key) =&gt; {
        const stage = stages[key];
        title.textContent = stage.title;
        purpose.textContent = stage.purpose;
        command.textContent = stage.command;
        model.textContent = stage.model;
        modelNote.textContent = stage.modelNote;
        evidence.textContent = stage.evidence;
        avoid.textContent = stage.avoid;
        stageExample.textContent = stage.example;
        buttons.forEach((button) =&gt; {
          const selected = button.dataset.stage === key;
          button.setAttribute(&#x27;aria-pressed&#x27;, String(selected));
          button.classList.toggle(&#x27;btn-primary&#x27;, selected);
        });
      };

      const selectSkill = (key) =&gt; {
        const skill = skillDetails[key];
        skillTitle.textContent = skill.title;
        skillWhen.textContent = skill.when;
        skillProduces.textContent = skill.produces;
        skillNext.textContent = skill.next;
        skillPrompt.textContent = skill.prompt;
      };

      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; selectStage(button.dataset.stage));
      });

      skillSelect.addEventListener(&#x27;change&#x27;, () =&gt; selectSkill(skillSelect.value));
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
