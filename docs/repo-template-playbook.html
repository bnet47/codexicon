:root[data-theme=&quot;light&quot;] {
  color-scheme: light;
}

:root[data-theme=&quot;dark&quot;] {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html &gt; body {
  margin: 0;
  padding: 5px;
  color: var(--foreground);
  background: transparent !important;
  font-family: var(--font-sans);
  font-size: var(--font-size-normal);
  font-weight: var(--font-weight-normal);
  line-height: var(--line-height-normal);
}

a {
  color: color-mix(in srgb, var(--viz-accent) 80%, var(--viz-text) 20%);
  cursor: pointer;
  font-weight: var(--viz-font-weight-medium);
  text-decoration: none;
  text-underline-offset: 2px;
}

a:is(:hover, :focus-visible) {
  text-decoration-line: underline;
  text-decoration-style: dashed;
  text-decoration-thickness: 0.5px;
}

h1,
h2,
h3,
h4,
h5,
h6,
p {
  margin-block: 0;
}

h1 {
  font-size: var(--font-size-h1);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h2 {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

h3,
h4,
h5,
h6 {
  font-size: var(--font-size-h3);
  font-weight: var(--font-weight-medium);
  line-height: 1.3;
}

b,
strong,
th {
  font-weight: var(--font-weight-medium);
}

code:not(pre code) {
  display: inline;
  padding: 1px 6px;
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background: var(--muted);
  font-family: var(--font-mono);
  font-size: 0.92em;
  overflow-wrap: anywhere;
  -webkit-box-decoration-break: clone;
  box-decoration-break: clone;
  word-break: break-word;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: superellipse(1.5);
  color: var(--card-foreground);
  background: var(--card);
}

#widget &gt; :not(.card) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--popover-foreground);
  background: var(--popover);
  box-shadow: none;
  font-size: var(--font-size-tooltip);
  line-height: var(--line-height-tooltip);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

.viz-badge {
  padding: 3px 8px;
  border-radius: var(--radius-full);
  color: var(--accent-foreground);
  background: var(--accent);
  font-weight: var(--font-weight-medium);
}

small,
.text-small,
.viz-badge {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

.btn {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  min-height: 28px;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: pointer;
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn-primary {
  border-color: transparent;
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: padding-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: padding-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.btn:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  min-height: 28px;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background: var(--secondary);
}

.form-control::placeholder {
  color: var(--muted-foreground);

  padding: 0;
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);

  min-height: 26px;
  margin-right: 8px;
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));

.form-control-color[type=&quot;color&quot;] {

  height: 28px;
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: superellipse(1.5);
}

textarea.form-control {
  height: auto;
  min-height: 72px;
  padding: 8px 10px;
  resize: vertical;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  min-height: 28px;
  margin: 0;
  padding: 0 32px 0 8px;
  outline: none;
  border: 1px solid var(--input);
  border-radius: var(--radius-lg);
  corner-shape: superellipse(1.5);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(45deg, transparent 50%, var(--muted-foreground) 50%),
    linear-gradient(135deg, var(--muted-foreground) 50%, transparent 50%);
  background-position:
    calc(100% - 14px) 50%,

  background-size: 4px 4px;
  cursor: var(--cursor-interaction, default);
}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);

    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: superellipse(1.5);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);

  height: 100%;

  height: 14px;

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;

  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);

  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
    [aria-pressed=&quot;true&quot;],
    [aria-selected=&quot;true&quot;],
    .is-selected
  ) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;codex-template-playbook&quot;&gt;
  &lt;style&gt;
    #codex-template-playbook {
      --manual-bg: light-dark(rgb(247 248 246), rgb(14 16 20));
      --manual-panel: light-dark(rgb(255 255 255), rgb(23 26 32));
      --manual-panel-strong: light-dark(rgb(236 240 244), rgb(30 35 43));
      --manual-ink: light-dark(rgb(17 23 33), rgb(244 247 250));
      --manual-muted: light-dark(rgb(76 86 101), rgb(166 176 188));
      --manual-line: light-dark(rgb(17 23 33 / 12%), rgb(255 255 255 / 12%));
      --manual-accent: light-dark(rgb(0 98 232), rgb(100 174 255));
      --manual-accent-soft: light-dark(rgb(226 239 255), rgb(15 49 82));
      --manual-signal: light-dark(rgb(220 90 34), rgb(255 145 94));
      --manual-safe: light-dark(rgb(24 135 84), rgb(84 207 145));
      --manual-radius: 12px;
      position: relative;
      display: grid;
      gap: 0;
      max-width: 1120px;
      margin: 0 auto;
      overflow: clip;
      color: var(--manual-ink);
      background: var(--manual-bg);
      border: 1px solid var(--manual-line);
      border-radius: var(--manual-radius);
      counter-reset: chapter;
      font-size: 16px;
      line-height: 1.6;
    }

    #codex-template-playbook * {
      scroll-margin-top: 5.5rem;
    }

    #codex-template-playbook h1,
    #codex-template-playbook h2,
    #codex-template-playbook h3,
    #codex-template-playbook p {
      max-width: 72ch;
    }

    #codex-template-playbook h1,
    #codex-template-playbook h2,
    #codex-template-playbook h3 {
      color: var(--manual-ink);
      letter-spacing: -0.025em;
    }

    #codex-template-playbook h1 {
      max-width: 12ch;
      margin: 0;
      font-size: clamp(3rem, 7vw, 6.5rem);
      line-height: 0.92;
    }

    #codex-template-playbook h2 {
      margin: 0;
      font-size: clamp(1.8rem, 3.4vw, 3rem);
      line-height: 1.05;
    }

    #codex-template-playbook h3 {
      margin-top: 0;
      font-size: clamp(1.1rem, 2vw, 1.35rem);
      line-height: 1.2;
    }

    #codex-template-playbook .text-muted {
      color: var(--manual-muted);
    }

    #codex-template-playbook code {
      border: 1px solid var(--manual-line);
      color: light-dark(rgb(19 62 115), rgb(193 220 255));
      background: light-dark(rgb(236 241 247), rgb(11 14 19));
      overflow-wrap: anywhere;
    }

    #codex-template-playbook .playbook-nav {
      position: sticky;
      z-index: 20;
      top: 0;
      display: flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.75rem clamp(1rem, 4vw, 3rem);
      overflow-x: auto;
      background: light-dark(rgb(247 248 246 / 96%), rgb(14 16 20 / 96%));
      border-bottom: 1px solid var(--manual-line);
      scrollbar-width: none;
    }

    #codex-template-playbook .playbook-nav::-webkit-scrollbar {
      display: none;
    }

    #codex-template-playbook .nav-mark {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-right: auto;
      color: var(--manual-ink);
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      white-space: nowrap;
      text-transform: uppercase;
    }

    #codex-template-playbook .nav-mark::before {
      width: 0.7rem;
      height: 0.7rem;
      background: var(--manual-accent);
      content: &quot;&quot;;
      box-shadow: 0.9rem 0 0 var(--manual-signal);
      transform: rotate(45deg);
    }

    #codex-template-playbook .playbook-nav a {
      min-height: 36px;
      padding: 0.35rem 0.65rem;
      border: 1px solid transparent;
      border-radius: 6px;
      color: var(--manual-muted);
      font-size: 0.78rem;
      font-weight: 650;
      line-height: 1.4;
      white-space: nowrap;
      text-decoration: none;
    }

    #codex-template-playbook .playbook-nav a:is(:hover, :focus-visible) {
      border-color: var(--manual-line);
      color: var(--manual-ink);
      background: var(--manual-panel);
      outline: 3px solid color-mix(in srgb, var(--manual-accent) 35%, transparent);
      outline-offset: 1px;
    }

    #codex-template-playbook .playbook-section {
      position: relative;
      display: grid;
      gap: 1.5rem;
      padding: clamp(4rem, 8vw, 7rem) clamp(1.25rem, 5vw, 4.75rem);
      border-top: 1px solid var(--manual-line);
      counter-increment: chapter;
    }

    #codex-template-playbook .playbook-section[data-chapter]::before {
      position: absolute;
      top: 2rem;
      left: clamp(1.25rem, 5vw, 4.75rem);
      color: var(--manual-accent);
      content: attr(data-chapter) &quot; / 08&quot;;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    #codex-template-playbook .playbook-hero {
      min-height: min(760px, calc(100dvh - 4rem));
      padding-top: clamp(3.5rem, 8vw, 7rem);
      color: rgb(242 246 251);
      background: rgb(13 18 26);
      border-top: 5px solid transparent;
      border-image: linear-gradient(90deg, rgb(0 118 255) 0 42%, rgb(255 116 59) 42% 68%, rgb(46 183 118) 68%) 1;
      counter-increment: none;
    }

    #codex-template-playbook .playbook-hero::after {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent 0 74%, rgb(255 255 255 / 5%) 74% 74.1%, transparent 74.1%),
        linear-gradient(0deg, transparent 0 68%, rgb(255 255 255 / 5%) 68% 68.1%, transparent 68.1%);
      content: &quot;&quot;;
    }

    #codex-template-playbook .hero-kicker {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      gap: 0.65rem;
      color: rgb(155 194 237);
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    #codex-template-playbook .hero-kicker::before {
      width: 2.5rem;
      height: 2px;
      background: rgb(72 156 255);
      content: &quot;&quot;;
    }

    #codex-template-playbook .hero-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(18rem, 0.75fr);
      gap: clamp(2.5rem, 6vw, 6rem);
      align-items: end;
    }

    #codex-template-playbook .playbook-hero h1 {
      color: rgb(248 250 252);
    }

    #codex-template-playbook .hero-lede {
      max-width: 54ch;
      margin: 1.5rem 0 0;
      color: rgb(181 193 207);
      font-size: clamp(1.05rem, 2vw, 1.35rem);
      line-height: 1.55;
    }

    #codex-template-playbook .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    #codex-template-playbook .hero-action {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 0.65rem 1rem;
      border: 1px solid rgb(255 255 255 / 18%);
      border-radius: 7px;
      color: rgb(236 242 248);
      font-size: 0.88rem;
      font-weight: 700;
      text-decoration: none;
    }

    #codex-template-playbook .hero-action-primary {
      border-color: rgb(78 158 255);
      color: rgb(7 19 34);
      background: rgb(91 169 255);
    }

    #codex-template-playbook .hero-action:is(:hover, :focus-visible) {
      outline: 3px solid rgb(91 169 255 / 38%);
      outline-offset: 3px;
      transform: translateY(-1px);
    }

    #codex-template-playbook .hero-manifest {
      position: relative;
      padding: 1rem;
      border: 1px solid rgb(255 255 255 / 14%);
      background: rgb(255 255 255 / 4%);
      box-shadow: 12px 12px 0 rgb(0 0 0 / 24%);
    }

    #codex-template-playbook .manifest-head {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid rgb(255 255 255 / 12%);
      color: rgb(132 151 171);
      font-family: var(--font-mono);
      font-size: 0.65rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #codex-template-playbook .manifest-flow {
      display: grid;
      gap: 0;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #codex-template-playbook .manifest-flow li {
      display: grid;
      grid-template-columns: 2.4rem 1fr;
      gap: 0.75rem;
      padding: 1rem 0;
      border-bottom: 1px solid rgb(255 255 255 / 10%);
    }

    #codex-template-playbook .manifest-flow li:last-child {
      border-bottom: 0;
    }

    #codex-template-playbook .manifest-index {
      color: rgb(98 176 255);
      font-family: var(--font-mono);
      font-size: 0.72rem;
    }

    #codex-template-playbook .manifest-flow strong {
      display: block;
      color: rgb(244 247 250);
      font-size: 0.9rem;
    }

    #codex-template-playbook .manifest-flow small {
      display: block;
      margin-top: 0.15rem;
      color: rgb(151 166 182);
      line-height: 1.45;
    }

    #codex-template-playbook .hero-proof {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-top: clamp(2rem, 5vw, 4rem);
      border-top: 1px solid rgb(255 255 255 / 13%);
      border-bottom: 1px solid rgb(255 255 255 / 13%);
    }

    #codex-template-playbook .proof-item {
      padding: 1rem 1rem 1rem 0;
      border-right: 1px solid rgb(255 255 255 / 13%);
    }

    #codex-template-playbook .proof-item:not(:first-child) {
      padding-left: 1rem;
    }

    #codex-template-playbook .proof-item:last-child {
      border-right: 0;
    }

    #codex-template-playbook .proof-item strong {
      display: block;
      color: rgb(242 246 251);
      font-size: 0.88rem;
    }

    #codex-template-playbook .proof-item span {
      display: block;
      margin-top: 0.2rem;
      color: rgb(137 153 169);
      font-size: 0.76rem;
    }

    #codex-template-playbook .stage-content {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem 1.5rem;
    }

    #codex-template-playbook .stage-content &gt; div {
      min-width: 0;
    }

    #codex-template-playbook .stage-content p {
      margin-bottom: 0;
    }

    #codex-template-playbook .entry-grid {
      gap: 1rem;
    }

    #codex-template-playbook .entry-card {
      position: relative;
      min-height: 13rem;
      padding: 1.4rem;
      overflow: hidden;
      border: 1px solid var(--manual-line);
      border-top: 4px solid var(--entry-color);
      background: var(--manual-panel);
    }

    #codex-template-playbook .entry-card:first-child {
      --entry-color: var(--manual-accent);
    }

    #codex-template-playbook .entry-card:last-child {
      --entry-color: var(--manual-signal);
    }

    #codex-template-playbook .entry-watermark {
      position: absolute;
      right: -1rem;
      bottom: -2.5rem;
      color: color-mix(in srgb, var(--entry-color) 12%, transparent);
      font-family: var(--font-mono);
      font-size: 6rem;
      font-weight: 800;
      line-height: 1;
      pointer-events: none;
    }

    #codex-template-playbook .entry-tag {
      display: block;
      margin-bottom: 2.5rem;
      color: var(--entry-color);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #codex-template-playbook .entry-card strong {
      position: relative;
      z-index: 1;
      display: block;
      margin-bottom: 0.55rem;
      font-size: 1.25rem;
    }

    #codex-template-playbook .entry-card p {
      position: relative;
      z-index: 1;
    }

    #codex-template-playbook .entry-note {
      margin: 0;
      padding: 1rem 1.1rem;
      border-left: 3px solid var(--manual-safe);
      color: var(--manual-muted);
      background: color-mix(in srgb, var(--manual-safe) 7%, transparent);
    }

    #codex-template-playbook .viz-controls {
      position: relative;
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 0.65rem;
    }

    #codex-template-playbook .viz-controls::before {
      position: absolute;
      z-index: 0;
      top: 50%;
      right: 3%;
      left: 3%;
      height: 2px;
      background: var(--manual-line);
      content: &quot;&quot;;
    }

    #codex-template-playbook .viz-controls .btn {
      position: relative;
      z-index: 1;
      min-height: 48px;
      padding: 0.6rem 0.75rem;
      border: 1px solid var(--manual-line);
      border-radius: 7px;
      color: var(--manual-muted);
      background: var(--manual-panel);
      box-shadow: none;
      font-size: 0.78rem;
      font-weight: 720;
      white-space: nowrap;
    }

    #codex-template-playbook .viz-controls .btn:is(:hover, :focus-visible) {
      border-color: var(--manual-accent);
      color: var(--manual-ink);
      outline: 3px solid color-mix(in srgb, var(--manual-accent) 28%, transparent);
      outline-offset: 2px;
    }

    #codex-template-playbook .viz-controls .btn[aria-pressed=&quot;true&quot;] {
      border-color: var(--manual-accent);
      color: white;
      background: var(--manual-accent);
      box-shadow: 0 7px 0 color-mix(in srgb, var(--manual-accent) 25%, transparent);
    }

    #codex-template-playbook .card {
      padding: clamp(1.25rem, 3vw, 2rem);
      border: 1px solid var(--manual-line);
      border-radius: var(--manual-radius);
      background: var(--manual-panel);
      box-shadow: none;
    }

    #codex-template-playbook .stage-panel {
      border-left: 5px solid var(--manual-accent);
      border-radius: 0 var(--manual-radius) var(--manual-radius) 0;
    }

    #codex-template-playbook .stage-panel.is-refreshed,
    #codex-template-playbook .skill-panel.is-refreshed {
      animation: panel-refresh 260ms ease-out;
    }

    #codex-template-playbook .stage-panel .stage-content &gt; div,
    #codex-template-playbook .skill-panel .stage-content &gt; div {
      padding-top: 0.9rem;
      border-top: 1px solid var(--manual-line);
    }

    #codex-template-playbook .capability-panel {
      background: var(--manual-panel-strong);
    }

    #codex-template-playbook .economy-panel {
      padding: 1.5rem;
      border: 1px dashed var(--manual-line);
    }

    @keyframes panel-refresh {
      from {
        opacity: 0.7;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    #codex-template-playbook .route-list {
      display: grid;
      overflow: hidden;
      border: 1px solid var(--manual-line);
      border-radius: var(--manual-radius);
      background: var(--manual-panel);
    }

    #codex-template-playbook .route-head,
    #codex-template-playbook .route-row {
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.9fr) minmax(0, 1.25fr);
      gap: 1rem;
      align-items: start;
      padding: 1rem 1.15rem;
      border-bottom: 1px solid var(--border);
    }

    #codex-template-playbook .route-head {
      color: var(--manual-muted);
      background: var(--manual-panel-strong);
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #codex-template-playbook .route-row {
      transition: background-color 160ms ease;
    }

    #codex-template-playbook .route-row:last-child {
      border-bottom: 0;
    }

    #codex-template-playbook .route-row:hover {
      background: color-mix(in srgb, var(--manual-accent) 5%, transparent);
    }

    #codex-template-playbook .route-row code {
      overflow-wrap: anywhere;
    }

    #codex-template-playbook .route-label {
      display: none;
      color: var(--muted-foreground);
    }

    #codex-template-playbook .skill-explorer {
      display: grid;
      grid-template-columns: minmax(13rem, 0.35fr) minmax(0, 1fr);
      gap: 1rem;
      align-items: start;
    }

    #codex-template-playbook .skill-picker {
      position: sticky;
      top: 5.5rem;
      padding: 1.25rem;
      border: 1px solid var(--manual-line);
      background: var(--manual-panel-strong);
    }

    #codex-template-playbook .skill-picker .form-label {
      color: var(--manual-accent);
      font-family: var(--font-mono);
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    #codex-template-playbook .skill-picker .form-select {
      min-height: 46px;
      margin-top: 0.5rem;
      border-color: var(--manual-line);
      color: var(--manual-ink);
      background-color: var(--manual-panel);
    }

    #codex-template-playbook .skill-picker .form-select:focus-visible {
      border-color: var(--manual-accent);
      outline: 3px solid color-mix(in srgb, var(--manual-accent) 28%, transparent);
      outline-offset: 2px;
    }

    #codex-template-playbook .skill-picker-note {
      margin: 1rem 0 0;
      color: var(--manual-muted);
      font-size: 0.78rem;
    }

    #codex-template-playbook .skill-panel h3 code {
      display: inline-block;
      padding: 0.35rem 0.55rem;
      border-color: color-mix(in srgb, var(--manual-accent) 35%, var(--manual-line));
      color: var(--manual-accent);
      background: var(--manual-accent-soft);
    }

    #codex-template-playbook .context-stack {
      display: grid;
      gap: 0.55rem;
    }

    #codex-template-playbook .context-layer {
      display: grid;
      grid-template-columns: minmax(8rem, 0.8fr) minmax(0, 1.6fr);
      gap: 1rem;
      align-items: center;
      min-height: 5rem;
      padding: 1rem 1.25rem;
      border: 1px solid color-mix(in srgb, var(--layer-color) 28%, var(--manual-line));
      background: color-mix(in srgb, var(--layer-color) 9%, var(--manual-panel));
    }

    #codex-template-playbook .context-layer:nth-child(1) {
      margin-inline: 18%;
      --layer-color: var(--viz-series-1);
    }

    #codex-template-playbook .context-layer:nth-child(2) {
      margin-inline: 9%;
      --layer-color: var(--viz-series-2);
    }

    #codex-template-playbook .context-layer:nth-child(3) {
      --layer-color: var(--viz-series-3);
    }

    #codex-template-playbook .task-loop {
      display: grid;
      grid-template-columns: repeat(13, minmax(0, auto));
      align-items: center;
      gap: 0.35rem;
      padding: 1.25rem;
      border: 1px solid var(--manual-line);
      background: var(--manual-panel-strong);
    }

    #codex-template-playbook .loop-node {
      display: grid;
      place-items: center;
      min-height: 5rem;
      padding: 0.75rem;
      border: 1px solid var(--manual-line);
      text-align: center;
      background: var(--manual-panel);
      border-bottom: 3px solid var(--manual-accent);
      font-size: 0.8rem;
      font-weight: 700;
    }

    #codex-template-playbook .loop-arrow {
      color: var(--muted-foreground);
      text-align: center;
    }

    #codex-template-playbook .guardrails {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0.75rem;
    }

    #codex-template-playbook .guardrail {
      --guard-color: var(--manual-accent);
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
      min-height: 8.5rem;
      padding: 1.1rem;
      border: 1px solid var(--manual-line);
      border-left: 4px solid var(--guard-color);

  &lt;section class=&quot;playbook-section playbook-hero&quot; aria-labelledby=&quot;playbook-heading&quot;&gt;
    &lt;div class=&quot;hero-kicker&quot;&gt;Agent operations manual&lt;/div&gt;
    &lt;div class=&quot;hero-grid&quot;&gt;
      &lt;div&gt;
        &lt;h1 id=&quot;playbook-heading&quot;&gt;Codexicon Playbook&lt;/h1&gt;
        &lt;p class=&quot;hero-lede&quot;&gt;A practical field guide for adopting and operating a production-minded Codex agent harness—from the first project decision to verified delivery.&lt;/p&gt;
        &lt;div class=&quot;hero-actions&quot;&gt;
          &lt;a class=&quot;hero-action hero-action-primary&quot; href=&quot;#lifecycle-heading&quot;&gt;Explore the lifecycle&lt;/a&gt;
          &lt;a class=&quot;hero-action&quot; href=&quot;#skills-heading&quot;&gt;Browse every skill&lt;/a&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div class=&quot;hero-manifest&quot; aria-label=&quot;Codexicon operating model&quot;&gt;
        &lt;div class=&quot;manifest-head&quot;&gt;&lt;span&gt;Operating model&lt;/span&gt;&lt;span&gt;Local-first&lt;/span&gt;&lt;/div&gt;
        &lt;ol class=&quot;manifest-flow&quot;&gt;
          &lt;li&gt;&lt;span class=&quot;manifest-index&quot;&gt;01&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Adopt or define&lt;/strong&gt;&lt;small&gt;Start from the repository and product truth you actually have.&lt;/small&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;manifest-index&quot;&gt;02&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Route deliberately&lt;/strong&gt;&lt;small&gt;Use the smallest workflow that matches uncertainty and risk.&lt;/small&gt;&lt;/div&gt;&lt;/li&gt;
          &lt;li&gt;&lt;span class=&quot;manifest-index&quot;&gt;03&lt;/span&gt;&lt;div&gt;&lt;strong&gt;Verify before effect&lt;/strong&gt;&lt;small&gt;Require evidence before Git, deployment, or other external action.&lt;/small&gt;&lt;/div&gt;&lt;/li&gt;
        &lt;/ol&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;hero-proof&quot; role=&quot;list&quot; aria-label=&quot;Codexicon characteristics&quot;&gt;
      &lt;div class=&quot;proof-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;New + established repositories&lt;/strong&gt;&lt;span&gt;Clean starts and plan-first adoption&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;proof-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Progressive workflows&lt;/strong&gt;&lt;span&gt;More process only when the task warrants it&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;proof-item&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Explicit authority&lt;/strong&gt;&lt;span&gt;Verification, Git, and deployment remain separate decisions&lt;/span&gt;&lt;/div&gt;

  &lt;section class=&quot;playbook-section&quot; data-chapter=&quot;01&quot; aria-labelledby=&quot;entry-heading&quot;&gt;
    &lt;div&gt;
      &lt;h2 id=&quot;entry-heading&quot;&gt;Start from the repository you actually have&lt;/h2&gt;
      &lt;p class=&quot;text-muted&quot;&gt;Codexicon supports a clean template start and plan-first adoption into an established repository.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;stage-content entry-grid&quot;&gt;
      &lt;div class=&quot;entry-card&quot;&gt;
        &lt;span class=&quot;entry-watermark&quot; aria-hidden=&quot;true&quot;&gt;NEW&lt;/span&gt;
        &lt;span class=&quot;entry-tag&quot;&gt;Start clean&lt;/span&gt;
        &lt;strong&gt;New repository&lt;/strong&gt;
        &lt;p&gt;Use the GitHub template or a clean local copy, verify the baseline, then run &lt;code&gt;$discover&lt;/code&gt; and &lt;code&gt;$init&lt;/code&gt;.&lt;/p&gt;
      &lt;/div&gt;
      &lt;div class=&quot;entry-card&quot;&gt;
        &lt;span class=&quot;entry-watermark&quot; aria-hidden=&quot;true&quot;&gt;ADOPT&lt;/span&gt;
        &lt;span class=&quot;entry-tag&quot;&gt;Integrate safely&lt;/span&gt;
        &lt;strong&gt;Established repository&lt;/strong&gt;
        &lt;p&gt;Keep the Codexicon source separate and run &lt;code&gt;$adopt-codexicon&lt;/code&gt; or &lt;code&gt;python scripts/codexicon.py inspect TARGET&lt;/code&gt; before authorising any writes. Use &lt;code&gt;docs/upgrading.md&lt;/code&gt; for the manual migration boundaries.&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;
    &lt;p class=&quot;text-small entry-note&quot;&gt;&lt;code&gt;inspect&lt;/code&gt;, &lt;code&gt;doctor&lt;/code&gt;, update planning, and &lt;code&gt;resume&lt;/code&gt; are read-only. Adoption and update mutations require &lt;code&gt;--apply&lt;/code&gt;; local conflicts and project-owned files are preserved for deliberate integration.&lt;/p&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; data-chapter=&quot;02&quot; aria-labelledby=&quot;lifecycle-heading&quot;&gt;
    &lt;div&gt;
      &lt;h2 id=&quot;lifecycle-heading&quot;&gt;From intent to a verified project&lt;/h2&gt;
      &lt;span class=&quot;viz-badge&quot;&gt;Codexicon · Matchday sports app&lt;/span&gt;
      &lt;p class=&quot;text-muted&quot;&gt;Select a stage to see its contract.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;viz-controls&quot; aria-label=&quot;Project lifecycle stages&quot;&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn btn-primary&quot; data-stage=&quot;discover&quot; aria-pressed=&quot;true&quot;&gt;1 · Discover&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;init&quot; aria-pressed=&quot;false&quot;&gt;2 · Initialise&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;build&quot; aria-pressed=&quot;false&quot;&gt;3 · Build&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;creative&quot; aria-pressed=&quot;false&quot;&gt;4 · Experience&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;assure&quot; aria-pressed=&quot;false&quot;&gt;5 · Assure&lt;/button&gt;
      &lt;button type=&quot;button&quot; class=&quot;btn&quot; data-stage=&quot;ship&quot; aria-pressed=&quot;false&quot;&gt;6 · Ship&lt;/button&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card stage-panel&quot; aria-live=&quot;polite&quot; aria-atomic=&quot;true&quot;&gt;
      &lt;h3 id=&quot;stage-title&quot;&gt;Discover the project&lt;/h3&gt;
      &lt;div class=&quot;stage-content&quot;&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Purpose&lt;/span&gt;
          &lt;p id=&quot;stage-purpose&quot;&gt;Define the problem, user, observable outcome, constraints, and non-goals before choosing technology.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Invoke&lt;/span&gt;
          &lt;p&gt;&lt;code id=&quot;stage-command&quot;&gt;$discover&lt;/code&gt;&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Recommended tier and effort&lt;/span&gt;
          &lt;p&gt;&lt;strong id=&quot;stage-model&quot;&gt;High-reasoning tier · standard effort&lt;/strong&gt;&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Raise reasoning when&lt;/span&gt;
          &lt;p id=&quot;stage-model-note&quot;&gt;Raise reasoning effort for regulated or unusually ambiguous products, especially when a wrong charter would create major safety, compliance, or investment risk.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Evidence to continue&lt;/span&gt;
          &lt;p id=&quot;stage-evidence&quot;&gt;An approved charter under agent_docs/briefs/.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Avoid&lt;/span&gt;
          &lt;p id=&quot;stage-avoid&quot;&gt;Selecting a framework or database before the problem and constraints require one.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;div&gt;
        &lt;span class=&quot;text-small text-muted&quot;&gt;Sports app prompt&lt;/span&gt;
        &lt;p&gt;&lt;code id=&quot;stage-example&quot;&gt;$discover We want a mobile-first sports app for community football fans to follow fixtures, live scores, standings, and match alerts. Success means a fan can find today&#x27;s match and understand its current state in under 10 seconds. Constraints: accessible web app, no betting features, no provider selected.&lt;/code&gt;&lt;/p&gt;
      &lt;/div&gt;
    &lt;/div&gt;

    &lt;div class=&quot;card capability-panel&quot;&gt;
      &lt;h3&gt;How to choose a capability tier&lt;/h3&gt;
      &lt;p&gt;&lt;strong&gt;Reliability-first policy:&lt;/strong&gt; use a high-reasoning tier for project gates and expensive-to-reverse decisions. A fast, low-cost tier may assist with narrow, reversible work after requirements are fixed, but should not own a gate.&lt;/p&gt;
      &lt;p class=&quot;text-small text-muted&quot;&gt;Choose the lowest reasoning effort that reliably satisfies the task, then raise it when ambiguity, risk, or review depth requires more. A model never replaces explicit done conditions, lint, tests, rendered inspection, or human approval. Leave the concrete model choice to the user’s current Codex configuration.&lt;/p&gt;
    &lt;/div&gt;

    &lt;div class=&quot;economy-panel&quot; aria-labelledby=&quot;communication-economy-heading&quot;&gt;
      &lt;h3 id=&quot;communication-economy-heading&quot;&gt;Communication economy&lt;/h3&gt;
      &lt;div class=&quot;stage-content&quot;&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Built into the template&lt;/span&gt;
          &lt;p&gt;Dense updates, targeted context, bounded logs, progressively loaded skills, and restrained delegation.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Use &lt;code&gt;$concise&lt;/code&gt;&lt;/span&gt;
          &lt;p&gt;Request terse communication at any stage. Reasoning, exact code and errors, implementation, tests, review, and safety remain unchanged.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;What stays complete&lt;/span&gt;
          &lt;p&gt;Requirements, decisions, code, commands, errors, verification evidence, review findings, risks, and handoffs.&lt;/p&gt;
        &lt;/div&gt;
        &lt;div&gt;
          &lt;span class=&quot;text-small text-muted&quot;&gt;Do not trade away&lt;/span&gt;
          &lt;p&gt;Reasoning effort, tool evidence, test depth, security detail, review quality, or useful development context.&lt;/p&gt;
        &lt;/div&gt;
      &lt;/div&gt;
      &lt;p class=&quot;text-small text-muted&quot;&gt;Communication compression and model reasoning are separate controls. The repository-native &lt;code&gt;$concise&lt;/code&gt; skill changes output style only and loads when relevant.&lt;/p&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; data-chapter=&quot;03&quot; aria-labelledby=&quot;prompt-heading&quot;&gt;
    &lt;h2 id=&quot;prompt-heading&quot;&gt;Give Codex four pieces of task truth&lt;/h2&gt;
    &lt;div class=&quot;prompt-anatomy&quot; role=&quot;list&quot; aria-label=&quot;Effective prompt structure&quot;&gt;
      &lt;div class=&quot;prompt-part&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Outcome&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Fans can follow a live match without refreshing.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;prompt-part&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Done when&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Score, clock, incidents, loading, stale, and error states are tested.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;prompt-part&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Constraints&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Mobile-first, keyboard accessible, existing API contract, no betting content.&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;prompt-part&quot; role=&quot;listitem&quot;&gt;&lt;strong&gt;Authority&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Local code changes only; do not commit, deploy, or contact users.&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; data-chapter=&quot;04&quot; aria-labelledby=&quot;routing-heading&quot;&gt;
    &lt;div&gt;
      &lt;h2 id=&quot;routing-heading&quot;&gt;Choose the smallest workflow that fits&lt;/h2&gt;
      &lt;p class=&quot;text-muted&quot;&gt;More ceremony only when uncertainty or reversibility requires it.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;route-list&quot; role=&quot;table&quot; aria-label=&quot;Workflow routing guide&quot;&gt;
      &lt;div class=&quot;route-head&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;columnheader&quot;&gt;Signal&lt;/span&gt;
        &lt;span role=&quot;columnheader&quot;&gt;Route&lt;/span&gt;
        &lt;span role=&quot;columnheader&quot;&gt;Result&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Established repository needs Codexicon&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$adopt-codexicon&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Read-only compatibility plan before any explicitly authorised integration&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Clear, small change&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$quick&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Small complete implementation with focused verification&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Feature behaviour is genuinely unclear&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$brainstorm&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Approved behaviour before implementation&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Precise durable requirement&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$spec → $write-plan&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Executable contract; plan only when dependencies justify it&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Approved independent work packages&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$execute-plan&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Bounded execution with integrated verification&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Unknown cause or costly technical choice&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$investigate / $architecture-review&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Root cause or explicit reversible decision&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;route-row&quot; role=&quot;row&quot;&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Signal · &lt;/span&gt;Customer-facing design or marketing&lt;/span&gt;
        &lt;code role=&quot;cell&quot;&gt;$design-experience / $create-marketing&lt;/code&gt;
        &lt;span role=&quot;cell&quot;&gt;&lt;span class=&quot;route-label&quot;&gt;Result · &lt;/span&gt;Rendered, evidence-backed work followed by &lt;code&gt;$review-creative&lt;/code&gt;&lt;/span&gt;

  &lt;section class=&quot;playbook-section&quot; data-chapter=&quot;06&quot; aria-labelledby=&quot;loop-heading&quot;&gt;
    &lt;h2 id=&quot;loop-heading&quot;&gt;After setup, repeat one disciplined loop&lt;/h2&gt;
    &lt;div class=&quot;task-loop&quot; aria-label=&quot;Feature delivery loop&quot;&gt;

  &lt;section class=&quot;playbook-section&quot; data-chapter=&quot;07&quot; aria-labelledby=&quot;context-heading&quot;&gt;
    &lt;div&gt;
      &lt;h2 id=&quot;context-heading&quot;&gt;Context expands only when the task needs it&lt;/h2&gt;
      &lt;p class=&quot;text-muted&quot;&gt;The template keeps ordinary work lean without weakening engineering checks.&lt;/p&gt;
    &lt;/div&gt;
    &lt;div class=&quot;context-stack&quot; role=&quot;list&quot; aria-label=&quot;Progressive context layers&quot;&gt;
      &lt;div class=&quot;context-layer&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;Always loaded&lt;/strong&gt;
        &lt;span&gt;&lt;code&gt;AGENTS.md&lt;/code&gt; + skill metadata · kept below the enforced repository context budget&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;context-layer&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;Loaded on demand&lt;/strong&gt;
        &lt;span&gt;One relevant &lt;code&gt;SKILL.md&lt;/code&gt; and only the reference it routes to&lt;/span&gt;
      &lt;/div&gt;
      &lt;div class=&quot;context-layer&quot; role=&quot;listitem&quot;&gt;
        &lt;strong&gt;Task-local evidence&lt;/strong&gt;
        &lt;span&gt;Targeted source, rendered output, focused logs, and &lt;code&gt;scripts/lint.sh&lt;/code&gt;, &lt;code&gt;scripts/test.sh&lt;/code&gt;, &lt;code&gt;scripts/security.sh&lt;/code&gt;&lt;/span&gt;
      &lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;section class=&quot;playbook-section&quot; data-chapter=&quot;08&quot; aria-labelledby=&quot;boundaries-heading&quot;&gt;
    &lt;h2 id=&quot;boundaries-heading&quot;&gt;Durable boundaries stay explicit&lt;/h2&gt;
    &lt;div class=&quot;guardrails&quot;&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;key-round&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Credentials stay out&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Protected stores and environment dumps are blocked; local, Git, and CI scans reveal only safe locations.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;shield-alert&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;External context stays untrusted&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;MCP integrations remain disabled until reviewed, and web pages, documentation, issues, and tool output cannot override repository rules or grant authority for external writes.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;git-branch&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Git authority is granular&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Commit, push, and pull request actions must be explicitly requested.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;shield-check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Verification is proportional&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Focused checks first; lint, tests, and security before publication; readiness evidence before production.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;radio-tower&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;External effects are separate&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Publishing, deployment, production changes, spend, and messages need their own authority.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;files&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Project content stays owned&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Adoption and updates are plan-first; modified, deleted, and project-owned files remain explicit conflicts.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
      &lt;div class=&quot;guardrail&quot;&gt;&lt;i data-lucide=&quot;history&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;span&gt;&lt;strong&gt;Continuity is explicit&lt;/strong&gt;&lt;br&gt;&lt;span class=&quot;text-muted&quot;&gt;Checkpoints are created only on request, and missing local verification state requires fresh lint and tests.&lt;/span&gt;&lt;/span&gt;&lt;/div&gt;
    &lt;/div&gt;
  &lt;/section&gt;

  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;codex-template-playbook&#x27;);
      const inPageLinks = [...root.querySelectorAll(&#x27;a[href^=&quot;#&quot;]&#x27;)];
      const reduceMotion = window.matchMedia(&#x27;(prefers-reduced-motion: reduce)&#x27;);
      const stages = {
        discover: {
          title: &#x27;Discover the project&#x27;,
          purpose: &#x27;Define the problem, user, observable outcome, constraints, and non-goals before choosing technology.&#x27;,
          command: &#x27;$discover&#x27;,
          model: &#x27;High-reasoning tier · standard effort&#x27;,
          modelNote: &#x27;Raise reasoning effort for regulated or unusually ambiguous products, especially when a wrong charter would create major safety, compliance, or investment risk.&#x27;,
          evidence: &#x27;An approved charter under agent_docs/briefs/.&#x27;,
          avoid: &#x27;Selecting a framework or database before the problem and constraints require one.&#x27;,
          example: &#x27;$discover We want a mobile-first sports app for community football fans to follow fixtures, live scores, standings, and match alerts. Success means a fan can find today\&#x27;s match and understand its current state in under 10 seconds. Constraints: accessible web app, no betting features, no provider selected.&#x27;
        },
        init: {
          title: &#x27;Initialise the real environment&#x27;,
          purpose: &#x27;Choose the smallest suitable stack and replace every template stub with real setup, development, lint, test, security, Git-gate, and CI commands.&#x27;,
          command: &#x27;$init&#x27;,
          model: &#x27;High-reasoning tier · standard effort&#x27;,
          modelNote: &#x27;Raise reasoning effort for unfamiliar stacks, complex infrastructure, security, compliance, migration, or production-critical setup.&#x27;,
          evidence: &#x27;Project identity, security and operations boundaries are filled; real commands, Git gates, CI, and supported platforms are verified.&#x27;,
          avoid: &#x27;Adding providers, dependencies, databases, or deployment services before the charter requires them.&#x27;,
          example: &#x27;$init Configure Matchday from the approved charter. Recommend the smallest stack for a responsive web app with live-score updates, create real setup/lint/test commands and CI, and do not initialise Git or add hosting unless requested.&#x27;
        },
        build: {
          title: &#x27;Build the first useful slice&#x27;,
          purpose: &#x27;Deliver the smallest complete behaviour that proves value, using the least ceremonial workflow that fits.&#x27;,
          command: &#x27;$quick · $brainstorm · $spec · $execute-plan&#x27;,
          model: &#x27;Default coding tier · lighter effort&#x27;,
          modelNote: &#x27;Raise reasoning effort for architecture, long-context work, security, data integrity, or expensive failure modes.&#x27;,
          evidence: &#x27;Observable behaviour, focused tests, canonical lint and tests, and a concise report of residual gaps.&#x27;,
          avoid: &#x27;Large scaffolds, speculative abstractions, unrelated cleanup, or plans for a clear one-file change.&#x27;,
          example: &#x27;$quick Add the Matchday fixture list using the existing API client. Done when upcoming matches show competition, teams, kickoff in the user\&#x27;s timezone, loading, empty, and error states, with focused tests and full repository checks.&#x27;
        },
        creative: {
          title: &#x27;Strengthen the customer experience&#x27;,
          purpose: &#x27;Shape interfaces or marketing from real users, brand context, product truth, reachable states, and approved evidence.&#x27;,
          command: &#x27;$design-experience · $create-marketing&#x27;,
          model: &#x27;High-reasoning tier · standard effort&#x27;,
          modelNote: &#x27;Raise reasoning effort for a new visual system, complex interaction, important campaign, or work where trust, accessibility, or brand damage would be costly.&#x27;,
          evidence: &#x27;Rendered output, complete states, accessible behaviour, sourced claims, channel fit, and explicit unknowns.&#x27;,
          avoid: &#x27;Generic visual systems, fake metrics or proof, decorative dashboards, unsupported claims, and unverified polish.&#x27;,
          example: &#x27;$design-experience Design Matchday\&#x27;s live match centre for fans checking a phone in a noisy stadium. Preserve the current identity, shape the score, clock, incidents, lineups, loading, stale, offline, and final states, then verify rendered mobile and desktop output.&#x27;
        },
        assure: {
          title: &#x27;Assure correctness and quality&#x27;,
          purpose: &#x27;Review the work against its request, engineering contract, customer task, brand, accessibility, truth, and release risk.&#x27;,
          command: &#x27;$review · $review-creative&#x27;,
          model: &#x27;High-reasoning tier · deeper effort&#x27;,
          modelNote: &#x27;Raise reasoning effort for security, privacy, payments, migrations, destructive operations, or release-blocking reviews. Do not use a weaker reviewer than the builder.&#x27;,
          evidence: &#x27;No unresolved release blockers; verification gaps are visible; lint and the full test suite pass when applicable.&#x27;,
          avoid: &#x27;Reviewing only source when rendered behaviour matters, cosmetic scoring, or manufacturing findings.&#x27;,
          example: &#x27;$review-creative Audit Matchday\&#x27;s rendered live match centre for comprehension, responsive behaviour, keyboard access, contrast, stale-score trust, generic sports-app patterns, and fabricated data. Report findings only; do not edit.&#x27;
        },
        ship: {
          title: &#x27;Prove readiness, then ship only what was authorised&#x27;,
          purpose: &#x27;Run the production gate when applicable, then perform only the explicitly requested Git action. Deployment and external writes remain separate decisions.&#x27;,
          command: &#x27;$production-readiness (launch) · $ship&#x27;,
          model: &#x27;Default coding tier for Git · high-reasoning tier for production&#x27;,
          modelNote: &#x27;Raise reasoning effort for a large final diff, the production gate, security, privacy, payments, migrations, destructive operations, or hard-to-reverse releases.&#x27;,
          evidence: &#x27;Security, lint, and tests pass; launch evidence is READY or explicitly accepted; only the requested Git action is completed.&#x27;,
          avoid: &#x27;Inferring publication, pushing to main, deploying, or sending external messages from a vague request to finish.&#x27;,
          example: &#x27;$ship Verify the Matchday fixture and live-score work, create a local commit with an appropriate message, and stop. Do not push, open a pull request, deploy, or message anyone.&#x27;
        }
      };

      const skillDetails = {
        discover: {
          title: &#x27;$discover&#x27;,
          when: &#x27;The copied template has no approved product definition and technical choices should wait.&#x27;,
          produces: &#x27;An approved charter covering the problem, user, outcome, constraints, evidence, and non-goals.&#x27;,
          next: &#x27;$init&#x27;,
          prompt: &#x27;$discover Define Matchday, a community football app for fixtures, live scores, standings, and match alerts. Clarify the users, observable success, data constraints, accessibility needs, and non-goals before choosing a stack.&#x27;
        },
        init: {
          title: &#x27;$init&#x27;,
          when: &#x27;A charter is approved and the unconfigured template must become a working project.&#x27;,
          produces: &#x27;The smallest suitable stack, project identity, real source/test structure, commands, CI, and verified local setup.&#x27;,
          next: &#x27;$quick or the workflow that fits the first slice&#x27;,
          prompt: &#x27;$init Configure Matchday from the approved charter. Recommend the smallest stack for a responsive web app with live-score updates, create real setup/lint/test commands and CI, and do not initialise Git or add hosting unless requested.&#x27;
        },
        &#x27;adopt-codexicon&#x27;: {
          title: &#x27;$adopt-codexicon&#x27;,
          when: &#x27;An established repository needs Codexicon guidance, hooks, verification, diagnostics, or a safe local-source update without replacing project-owned content.&#x27;,
          produces: &#x27;A read-only compatibility plan first, then only explicitly authorised absent-file adoption or baseline-safe updates with conflicts preserved.&#x27;,
          next: &#x27;Resolve conflicts deliberately, then run doctor and the target repository verification&#x27;,
          prompt: &#x27;$adopt-codexicon Inspect the existing Matchday repository from this trusted Codexicon source. Report project-owned requirements and conflicts first. Do not apply, commit, push, or replace existing content.&#x27;
        },
        brainstorm: {
          title: &#x27;$brainstorm&#x27;,
          when: &#x27;Feature behaviour or approach is genuinely unclear and different choices would change the product.&#x27;,
          produces: &#x27;Resolved alternatives and an approved behavioural specification; no premature implementation.&#x27;,
          next: &#x27;$spec or $write-plan when implementation is non-trivial&#x27;,
          prompt: &#x27;$brainstorm Decide how Matchday fans subscribe to goal, halftime, and final-score alerts. Resolve team versus match subscriptions, quiet hours, duplicate alerts, permissions, and cancellation before implementation.&#x27;
        },
        spec: {
          title: &#x27;$spec&#x27;,
          when: &#x27;The request is precise but needs a durable executable contract before code changes.&#x27;,
          produces: &#x27;Scope, behaviour, states, edge cases, acceptance criteria, and verification requirements.&#x27;,
          next: &#x27;$quick or $write-plan&#x27;,
          prompt: &#x27;$spec Specify Matchday offline score handling. Define freshness indicators, cached data, reconnect behaviour, incident ordering, accessibility announcements, analytics boundaries, and acceptance tests.&#x27;
        },
        &#x27;write-plan&#x27;: {
          title: &#x27;$write-plan&#x27;,
          when: &#x27;An approved spec spans dependent tasks, files, or verification stages that benefit from sequencing.&#x27;,
          produces: &#x27;Dependency-aware tasks with file scopes, acceptance mapping, and verification for each step.&#x27;,
          next: &#x27;$execute-plan&#x27;,
          prompt: &#x27;$write-plan Turn the approved Matchday live-match specification into tasks for API streaming, state management, match UI, accessibility, tests, and browser verification. Map every acceptance criterion to a task and check.&#x27;
        },
        quick: {
          title: &#x27;$quick&#x27;,
          when: &#x27;A clear change is tightly scoped and requires no design, dependency, schema, or architecture decision.&#x27;,
          produces: &#x27;The smallest complete implementation with focused checks and canonical repository verification.&#x27;,
          next: &#x27;$review when risk warrants it&#x27;,
          prompt: &#x27;$quick Add the Matchday fixture timezone label using the existing date utility. Done when kickoff shows the viewer timezone, handles missing timezone data, has focused tests, and full lint/tests pass.&#x27;
        },
        &#x27;execute-plan&#x27;: {
          title: &#x27;$execute-plan&#x27;,
          when: &#x27;An approved plan contains independent implementation work that can be delegated without losing integration control.&#x27;,
          produces: &#x27;Integrated implementation of the approved tasks with bounded delegation and final verification.&#x27;,
          next: &#x27;$review&#x27;,
          prompt: &#x27;$execute-plan Implement the approved Matchday standings and team-page plan. Delegate only independent tasks, preserve unrelated work, integrate centrally, and run every acceptance check in the plan.&#x27;
        },
        &#x27;design-experience&#x27;: {
          title: &#x27;$design-experience&#x27;,
          when: &#x27;An app or website needs intentional UI/UX, responsive states, accessibility, a visual system, redesign, or frontend polish.&#x27;,
          produces: &#x27;A shaped, distinctive, production-grade experience verified in rendered and operational states.&#x27;,
          next: &#x27;$review-creative&#x27;,
          prompt: &#x27;$design-experience Design Matchday\&#x27;s live match centre for fans checking a phone in a noisy stadium. Preserve the current identity, shape score, clock, incidents, lineups, loading, stale, offline, and final states, then verify mobile and desktop output.&#x27;
        },
        &#x27;create-marketing&#x27;: {
          title: &#x27;$create-marketing&#x27;,
          when: &#x27;Positioning, conversion copy, a campaign, launch, channel adaptation, or measurement needs evidence-backed execution.&#x27;,
          produces: &#x27;Channel-native assets plus an evidence ledger, assumptions, approvals, and measurement contract.&#x27;,
          next: &#x27;$review-creative before publication&#x27;,
          prompt: &#x27;$create-marketing Create Matchday launch copy for match alerts: one landing-page section and one email. Use only verified product behaviour, label unknown notification coverage, define measurement, and do not publish or send.&#x27;
        },
        &#x27;review-creative&#x27;: {
          title: &#x27;$review-creative&#x27;,
          when: &#x27;Customer-facing design, marketing, documents, presentations, or visuals need an independent anti-slop quality gate.&#x27;,
          produces: &#x27;Prioritised evidence-based findings, verification gaps, and a READY or NEEDS WORK verdict; no edits.&#x27;,
          next: &#x27;Fix confirmed findings, rerender, then review again&#x27;,
          prompt: &#x27;$review-creative Audit Matchday\&#x27;s rendered live match centre and launch page for comprehension, accessibility, stale-score trust, brand fit, unsupported claims, and generic sports-app patterns. Report findings only.&#x27;
        },
        investigate: {
          title: &#x27;$investigate&#x27;,
          when: &#x27;A reproducible failure or unexplained behaviour has an unknown cause.&#x27;,
          produces: &#x27;A root-cause diagnosis with evidence and the smallest credible fix direction; diagnosis only unless a fix is requested.&#x27;,
          next: &#x27;$quick or $spec after the cause is known&#x27;,
          prompt: &#x27;$investigate Matchday displays the same goal twice after reconnecting to live updates. Reproduce it, trace event identity and reconnect state, identify the root cause, and do not implement a fix yet.&#x27;
        },
        &#x27;architecture-review&#x27;: {
          title: &#x27;$architecture-review&#x27;,
          when: &#x27;A framework, database, integration, ownership boundary, or other expensive-to-reverse choice needs evaluation.&#x27;,
          produces: &#x27;A recommendation with trade-offs, reversibility, evidence, and an ADR only when authorised.&#x27;,
          next: &#x27;$spec or an authorised ADR&#x27;,
          prompt: &#x27;$architecture-review Evaluate Server-Sent Events versus WebSockets for Matchday live scores across mobile networks. Compare reliability, scale, hosting, recovery, testing, and operational cost. Do not record an ADR unless I approve the decision.&#x27;
        },
        retro: {
          title: &#x27;$retro&#x27;,
          when: &#x27;A milestone, repeated blockage, scope drift, or invalid plan requires reassessing direction rather than debugging one defect.&#x27;,
          produces: &#x27;A continue, stop, or pivot recommendation with evidence and concrete next action.&#x27;,
          next: &#x27;Continue, re-specify, or stop based on the decision&#x27;,
          prompt: &#x27;$retro Matchday has completed two milestones but live-data integration keeps expanding scope and delaying fan-visible value. Assess whether to continue, narrow to scheduled scores, or pivot the delivery sequence.&#x27;
        },
        review: {
          title: &#x27;$review&#x27;,
          when: &#x27;A diff needs a read-only correctness, security, regression, scope, and test review against its request or spec.&#x27;,
          produces: &#x27;Prioritised actionable findings and verification gaps; no modifications.&#x27;,
          next: &#x27;Fix findings, verify, then $ship if authorised&#x27;,
          prompt: &#x27;$review Review the Matchday match-reminder diff against its approved spec. Focus on duplicate scheduling, timezone changes, opt-out behaviour, privacy, regressions, and missing tests. Do not edit.&#x27;

        &#x27;production-readiness&#x27;: {
          title: &#x27;$production-readiness&#x27;,
          when: &#x27;A first launch or major production change needs evidence across security, data, recovery, observability, capacity, abuse resistance, and rollback.&#x27;,
          produces: &#x27;Prioritised gaps plus a READY, READY WITH ACCEPTED RISK, or NOT READY verdict; no deployment or risk acceptance.&#x27;,
          next: &#x27;Close blockers, rerun the gate, then $ship under explicit Git authority&#x27;,
          prompt: &#x27;$production-readiness Audit Matchday before launch. Verify account and club-admin authorization, live-score provider failure, notification abuse and rate limits, privacy and retention, dependency risk, observability, capacity, backups and restore evidence, migration order, rollback, incident ownership, and canonical security/lint/tests. Do not deploy or accept risk for me.&#x27;

        ship: {
          title: &#x27;$ship&#x27;,

          produces: &#x27;Security/lint/test verified changes and only the authorised Git action; never an inferred deployment.&#x27;,
          next: &#x27;Deployment only under separate explicit authority&#x27;,
          prompt: &#x27;$ship Verify the Matchday fixture and live-score work, create a local commit with an appropriate message, and stop. Do not push, open a pull request, deploy, or message anyone.&#x27;
        },
        &#x27;conventional-commit&#x27;: {
          title: &#x27;$conventional-commit&#x27;,
          when: &#x27;A Conventional Commit message is requested without authorising any Git operation.&#x27;,
          produces: &#x27;A correctly scoped commit subject and optional body; no commit is created.&#x27;,
          next: &#x27;$ship only if a Git action is explicitly requested&#x27;,
          prompt: &#x27;$conventional-commit Draft a commit message for replacing Matchday score polling with reconnect-safe event streaming and adding duplicate-event tests. Do not run Git.&#x27;
        },
        concise: {
          title: &#x27;$concise&#x27;,
          when: &#x27;The user wants shorter progress updates and answers without reducing implementation, reasoning, safety, or verification quality.&#x27;,
          produces: &#x27;Dense communication with exact technical evidence preserved.&#x27;,
          next: &#x27;Use alongside the task-specific skill&#x27;,
          prompt: &#x27;$concise Keep updates terse while adding the Matchday competition filter. Preserve exact code, errors, decisions, and test results; do not reduce engineering checks.&#x27;
        },
        &#x27;context-dump&#x27;: {
          title: &#x27;$context-dump&#x27;,
          when: &#x27;A human-readable handoff is requested or a complex session must continue cleanly elsewhere; not for routine completion.&#x27;,
          produces: &#x27;An explicit atomic Markdown checkpoint with repository identity, related paths, objective, decisions, verification, open risks, and next action.&#x27;,
          next: &#x27;Run python scripts/codexicon.py resume in a fresh task and verify the checkpoint against the current diff&#x27;,
          prompt: &#x27;$context-dump Save an explicit checkpoint for Matchday\&#x27;s live match centre with the current objective, approved behaviour, related project paths, architecture decisions, test status, unresolved reconnect issue, and exact next step.&#x27;
        }

      const title = root.querySelector(&#x27;#stage-title&#x27;);
      const purpose = root.querySelector(&#x27;#stage-purpose&#x27;);
      const command = root.querySelector(&#x27;#stage-command&#x27;);
      const model = root.querySelector(&#x27;#stage-model&#x27;);
      const modelNote = root.querySelector(&#x27;#stage-model-note&#x27;);
      const evidence = root.querySelector(&#x27;#stage-evidence&#x27;);
      const avoid = root.querySelector(&#x27;#stage-avoid&#x27;);

      const selectStage = (key) =&gt; {

        title.textContent = stage.title;
        purpose.textContent = stage.purpose;
        command.textContent = stage.command;
        model.textContent = stage.model;

      const selectSkill = (key) =&gt; {

        skillPanel.classList.remove(&#x27;is-refreshed&#x27;);
        requestAnimationFrame(() =&gt; skillPanel.classList.add(&#x27;is-refreshed&#x27;));

      buttons.forEach((button) =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; selectStage(button.dataset.stage));

      skillSelect.addEventListener(&#x27;change&#x27;, () =&gt; selectSkill(skillSelect.value));
