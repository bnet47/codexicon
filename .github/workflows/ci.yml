name: Template CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Codex template
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Diagnose harness configuration
        run: python scripts/codexicon.py doctor --root .
      - name: Lint and structural checks (POSIX)
        if: runner.os != 'Windows'
        run: ./scripts/lint.sh
      - name: Tests (POSIX)
        if: runner.os != 'Windows'
        run: ./scripts/test.sh
      - name: Tracked Git-hook smoke tests (POSIX)
        if: runner.os != 'Windows'
        run: |
          ./.githooks/pre-commit
          ./.githooks/pre-push
      - name: Lint and structural checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/lint.ps1
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Security (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/security.ps1

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Canonical local security gate
        run: bash ./scripts/security.sh
      - uses: trufflesecurity/trufflehog@20652fbbdefffcdaa493a5bf57ab2ac6b1db715b # v3.97.1
        with:
          version: 3.97.0
          extra_args: --results=verified,unknown
