name: Template CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Codex template
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Diagnose harness configuration
        run: python scripts/codexicon.py doctor --root .
      - name: Lint and structural checks (POSIX)
        if: runner.os != 'Windows'
        run: ./scripts/lint.sh
      - name: Tests (POSIX)
        if: runner.os != 'Windows'
        run: ./scripts/test.sh
      - name: Tracked Git-hook smoke tests (POSIX)
        if: runner.os != 'Windows'
        run: |
          ./.githooks/pre-commit
          ./.githooks/pre-push
      - name: Lint and structural checks (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/lint.ps1
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Security (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/security.ps1

  security:
    name: Security gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.13"
      - name: Canonical local security gate
        run: bash ./scripts/security.sh
      - uses: trufflesecurity/trufflehog@27b0417c16317ca9a472a9a8092acce143b49c55 # v3.95.9
        with:
          version: 3.95.9
          extra_args: --results=verified,unknown
